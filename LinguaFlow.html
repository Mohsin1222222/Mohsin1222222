        </div>
        <div style={{ display: 'flex', gap: '6px', flexWrap: 'wrap' }}>
          <button onClick={() => setMode('shadow')} style={btn(mode === 'shadow' ? 'amber' : 'secondary', 'sm')}>
            <Headphones size={14} /> تقليد (Shadowing)
          </button>
          <button onClick={() => setMode('pron')} style={btn(mode === 'pron' ? 'amber' : 'secondary', 'sm')}>
            <Mic size={14} /> تقييم النطق
          </button>
          <button onClick={() => setMode('minpairs')} style={btn(mode === 'minpairs' ? 'amber' : 'secondary', 'sm')}>
            <Zap size={14} /> أزواج صوتية
          </button>
          <button onClick={() => setMode('convo')} style={btn(mode === 'convo' ? 'amber' : 'secondary', 'sm')}>
            <MessageCircle size={14} /> سيناريو محادثة
          </button>
          <button onClick={() => setMode('interview')} style={btn(mode === 'interview' ? 'amber' : 'secondary', 'sm')}>
            <Briefcase size={14} /> مقابلة محاكاة
          </button>
        </div>
      </div>
      {mode === 'shadow' && <ShadowingMode words={words} />}
      {mode === 'pron' && <PronunciationMode words={words} />}
      {mode === 'minpairs' && <MinimalPairsMode />}
      {mode === 'convo' && <ConversationMode />}
      {mode === 'interview' && <MockInterviewMode />}
    </div>
  );
}

/* ---------- Minimal Pairs ---------- */
const PHONEME_GROUPS = [
  { id: 'p-b',  ar: '/p/ مقابل /b/',  en: '/p/ vs /b/',  hintAr: 'العربية تنطق p كـ b — اشدّ شفتيك دون اهتزاز.' },
  { id: 'v-f',  ar: '/v/ مقابل /f/',  en: '/v/ vs /f/',  hintAr: 'v بشفة سفلى مع اهتزاز خفيف، f بدون اهتزاز.' },
  { id: 'th',   ar: '/θ/ مقابل /ð/',  en: '/θ/ vs /ð/',  hintAr: 'ضع طرف اللسان بين الأسنان: θ بدون صوت (think)، ð بصوت (this).' },
  { id: 'i-ii', ar: '/ɪ/ مقابل /iː/', en: '/ɪ/ vs /iː/', hintAr: 'ɪ قصيرة مرتخية (ship)، iː ممدودة مشدودة (sheep).' },
  { id: 'ae-e', ar: '/æ/ مقابل /e/',  en: '/æ/ vs /e/',  hintAr: 'æ أوسع وأطول (cat)، e أقصر (bed).' },
  { id: 's-z',  ar: '/s/ مقابل /z/',  en: '/s/ vs /z/',  hintAr: 'z تهتز فيها الحبال الصوتية، s لا.' },
];

function MinimalPairsMode() {
  const [groupId, setGroupId] = useState('p-b');
  const [pairs, setPairs] = useState([]);
  const [loading, setLoading] = useState(false);
  const [err, setErr] = useState('');
  const [submode, setSubmode] = useState('listen');
  const group = PHONEME_GROUPS.find(g => g.id === groupId);

  // Listen-mode state
  const [quizIdx, setQuizIdx] = useState(0);
  const [played, setPlayed] = useState(null);
  const [userAnswer, setUserAnswer] = useState(null);
  const [score, setScore] = useState({ correct: 0, total: 0 });

  // Speak-mode state
  const [target, setTarget] = useState(null);
  const [transcript, setTranscript] = useState('');
  const [listening, setListening] = useState(false);
  const [speakResult, setSpeakResult] = useState(null);
  const recRef = useRef(null);
  const SR = typeof window !== 'undefined' ? (window.SpeechRecognition || window.webkitSpeechRecognition) : null;

  const fetchPairs = async () => {
    setLoading(true); setErr(''); setPairs([]); setPlayed(null); setUserAnswer(null); setScore({ correct: 0, total: 0 }); setQuizIdx(0); setTarget(null); setTranscript(''); setSpeakResult(null);
    try {
      const prompt =
`Give 8 minimal pairs that target the contrast ${group.en} for an Arabic-speaking learner.
Each pair must differ ONLY by the target phoneme. Avoid pairs with multiple phoneme differences.

Return ONLY JSON:
{
  "pairs": [
    {"a":"word with first sound","b":"word with second sound","sentenceA":"a short sentence using A","sentenceB":"a short sentence using B"},
    ...
  ]
}`;
      const t = await callAI(prompt, null, 1500);
      const obj = extractJSON(t);
      if (!obj || !Array.isArray(obj.pairs)) throw new Error('parse');
      setPairs(obj.pairs.slice(0, 8));
    } catch (e) {
      if (e.code === 'NO_API_KEY') setErr('أدخل مفتاح API من زر الإعدادات');
      else if (e.code === 'INVALID_KEY') setErr('مفتاح API غير صالح');
      else setErr('تعذّر جلب الأزواج');
    } finally { setLoading(false); }
  };

  useEffect(() => { fetchPairs(); /* eslint-disable-next-line */ }, [groupId]);
  useEffect(() => () => { try { recRef.current?.stop(); } catch {} }, []);

  // ------- Listen submode helpers -------
  const playRandom = () => {
    if (!pairs[quizIdx]) return;
    const pick = Math.random() < 0.5 ? 'a' : 'b';
    setPlayed(pick); setUserAnswer(null);
    speak(pairs[quizIdx][pick], 'en-US', 0.85);
  };
  const answer = (pick) => {
    if (!played || userAnswer) return;
    setUserAnswer(pick);
    setScore(s => ({ correct: s.correct + (pick === played ? 1 : 0), total: s.total + 1 }));
  };
  const nextQuiz = () => {
    setPlayed(null); setUserAnswer(null);
    setQuizIdx(i => Math.min(i + 1, pairs.length - 1));
  };

  // ------- Speak submode helpers -------
  const pickSpeakTarget = (word) => {
    setTarget(word); setTranscript(''); setSpeakResult(null);
    setTimeout(() => speak(word, 'en-US', 0.85), 100);
  };
  const startSpeak = () => {
    if (!SR || !target) return;
    setTranscript(''); setSpeakResult(null);
    const c = createRecognitionController({
      lang: 'en-US',
      onText: (t) => setTranscript(prev => (prev ? prev + ' ' : '') + t),
      onInterim: () => {},
      onError: (msg) => msg && setErr(msg),
      onState: setListening,
    });
    if (!c) return;
    recRef.current = c; c.start();
  };
  const stopSpeak = () => { try { recRef.current?.stop(); } catch {} setListening(false); };
  const checkSpeak = () => {
    if (!transcript || !target) return;
    const heard = transcript.toLowerCase().split(/\s+/);
    const want = target.toLowerCase();
    const matched = heard.includes(want);
    setSpeakResult({ matched, heard: transcript.trim() });
  };

  const curPair = pairs[quizIdx];
  const accuracy = score.total > 0 ? Math.round((score.correct / score.total) * 100) : 0;

  return (
    <div style={T.card}>
      <MicNotice />
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', flexWrap: 'wrap', gap: '6px' }}>
        <h2 style={T.h2}>الأزواج الصوتية</h2>
        <button onClick={fetchPairs} disabled={loading} style={btn('amber', 'sm')}>
          {loading ? <Spinner size={14} /> : <RefreshCw size={14} />} أزواج جديدة
        </button>
      </div>
      <div style={{ ...T.muted, marginTop: '4px', marginBottom: '10px' }}>
        تدريب على الأصوات التي يخلطها الناطق العربي. اختر الزوج، ثم استمع وميّز، أو انطق وتحقق.
      </div>

      <div style={{ display: 'flex', flexWrap: 'wrap', gap: '6px', marginBottom: '10px' }}>
        {PHONEME_GROUPS.map(g => (
          <button key={g.id} onClick={() => setGroupId(g.id)} style={btn(groupId === g.id ? 'amber' : 'secondary', 'sm')}>
            {g.ar}
          </button>
        ))}
      </div>

      {group && (
        <div style={{ ...T.cardInner, background: AMBER.bg, borderColor: AMBER.border, marginBottom: '10px' }}>
          <div style={{ color: AMBER.text, fontSize: '13px' }}>💡 {group.hintAr}</div>
        </div>
      )}

      <div style={{ display: 'flex', gap: '6px', flexWrap: 'wrap', marginBottom: '10px' }}>
        <button onClick={() => setSubmode('listen')} style={btn(submode === 'listen' ? 'amber' : 'secondary', 'sm')}>
          <Headphones size={14} /> استمع وميّز
        </button>
        <button onClick={() => setSubmode('speak')} style={btn(submode === 'speak' ? 'amber' : 'secondary', 'sm')}>
          <Mic size={14} /> انطق وتحقق
        </button>
      </div>

      {err && <div style={{ color: 'var(--color-text-danger, #B91C1C)', marginBottom: '8px', fontSize: '13px' }}>{err}</div>}

      {pairs.length === 0 && loading && <div style={T.muted}>جاري تحضير الأزواج...</div>}

      {pairs.length > 0 && submode === 'listen' && curPair && (
        <div>
          <div style={{ ...T.muted, marginBottom: '6px' }}>
            ({quizIdx + 1} / {pairs.length}) — الدقة: {accuracy}% ({score.correct}/{score.total})
          </div>
          <div style={{ ...T.cardInner, textAlign: 'center', marginBottom: '10px' }}>
            <button onClick={playRandom} style={btn('primary', 'lg')}>
              <Volume2 size={16} /> شغّل كلمة واحدة
            </button>
            <div style={{ ...T.muted, marginTop: '6px', fontSize: '12px' }}>سأشغّل إحدى الكلمتين عشوائياً — أيّ واحدة سمعت؟</div>
          </div>
          <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '8px' }}>
            {['a', 'b'].map(k => {
              const word = curPair[k];
              let variant = 'secondary';
              if (userAnswer) {
                if (k === played) variant = 'success';
                else if (k === userAnswer) variant = 'danger';
              } else if (played) variant = 'amber';
              return (
                <button key={k} onClick={() => answer(k)} disabled={!played || !!userAnswer}
                  style={{ ...btn(variant, 'md'), flexDirection: 'column', padding: '14px' }}>
                  <span dir="ltr" style={{ ...T.english, fontSize: '20px', fontWeight: 700 }}>{word}</span>
                </button>
              );
            })}
          </div>
          {userAnswer && (
            <div style={{ marginTop: '10px', display: 'flex', flexDirection: 'column', gap: '8px' }}>
              <div style={pill(userAnswer === played ? 'success' : 'danger')}>
                {userAnswer === played ? '✓ صحيح' : `✗ كان الصوت: ${curPair[played]}`}
              </div>
              {curPair.sentenceA && (
                <div style={T.cardInner}>
                  <div dir="ltr" style={{ ...T.english, fontSize: '13px' }}>{curPair.sentenceA}</div>
                  <button onClick={() => speak(curPair.sentenceA)} style={{ ...btn('ghost', 'sm'), marginTop: '4px' }}>
                    <Volume2 size={12} /> A
                  </button>
                </div>
              )}
              {curPair.sentenceB && (
                <div style={T.cardInner}>
                  <div dir="ltr" style={{ ...T.english, fontSize: '13px' }}>{curPair.sentenceB}</div>
                  <button onClick={() => speak(curPair.sentenceB)} style={{ ...btn('ghost', 'sm'), marginTop: '4px' }}>
                    <Volume2 size={12} /> B
                  </button>
                </div>
              )}
              <button onClick={nextQuiz} disabled={quizIdx >= pairs.length - 1} style={btn('primary', 'md')}>
                التالي
              </button>
            </div>
          )}
        </div>
      )}

      {pairs.length > 0 && submode === 'speak' && (
        <div>
          <div style={{ ...T.muted, marginBottom: '6px' }}>اختر الكلمة المستهدفة، استمع لها، ثم اضغط الميكروفون وانطقها.</div>
          <div style={{ display: 'flex', flexDirection: 'column', gap: '6px', marginBottom: '10px' }}>
            {pairs.map((p, i) => (
              <div key={i} style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '6px' }}>
                {['a', 'b'].map(k => (
                  <button key={k} onClick={() => pickSpeakTarget(p[k])}
                    style={btn(target === p[k] ? 'amber' : 'secondary', 'sm')}>
                    <span dir="ltr" style={T.english}>{p[k]}</span>
                  </button>
                ))}
              </div>
            ))}
          </div>
          {target && (
            <div style={{ ...T.cardInner, marginBottom: '10px' }}>
              <div style={T.label}>الكلمة المستهدفة</div>
              <div dir="ltr" style={{ ...T.english, fontSize: '20px', fontWeight: 700 }}>{target}</div>
              <div style={{ display: 'flex', gap: '6px', flexWrap: 'wrap', marginTop: '8px' }}>
                <button onClick={() => speak(target, 'en-US', 0.7)} style={btn('amber', 'sm')}>
                  <Volume2 size={14} /> استمع بطيء
                </button>
                {!listening ? (
                  <button onClick={startSpeak} disabled={!SR} style={btn('danger', 'sm')}>
                    <Mic size={14} /> ابدأ التسجيل
                  </button>
                ) : (
                  <button onClick={stopSpeak} style={btn('primary', 'sm')}>
                    <MicOff size={14} /> أوقف
                  </button>
                )}
                <button onClick={checkSpeak} disabled={!transcript} style={btn('success', 'sm')}>
                  <Check size={14} /> تحقق
                </button>
              </div>
              {transcript && (
                <div style={{ ...T.muted, marginTop: '8px' }}>سُمع منك: <span dir="ltr" style={T.english}>{transcript}</span></div>
              )}
              {speakResult && (
                <div style={{ marginTop: '8px' }}>
                  <span style={pill(speakResult.matched ? 'success' : 'danger')}>
                    {speakResult.matched ? '✓ نُطقت بشكل صحيح' : '✗ لم يُتعرّف عليها — جرّب أبطأ وأوضح'}
                  </span>
                </div>
              )}
            </div>
          )}
        </div>
      )}
    </div>
  );
}

/* ---------- Mock Interview ---------- */
const INTERVIEW_SCENARIOS = [
  { id: 'legal',    ar: 'مقابلة قانونية (طالب/متدرّب)', en: 'legal trainee/clerkship interview' },
  { id: 'business', ar: 'مقابلة عمل عامة',              en: 'general business/job interview' },
  { id: 'visa',     ar: 'مقابلة فيزا/سفارة',            en: 'visa or embassy interview' },
  { id: 'academic', ar: 'مقابلة قبول جامعي',            en: 'university admission interview' },
  { id: 'media',    ar: 'مقابلة صحفية',                  en: 'press interview' },
];

function MockInterviewMode() {
  const [scenarioId, setScenarioId] = useState('legal');
  const [intro, setIntro] = useState(null);
  const [history, setHistory] = useState([]); // {role:'ai'|'user', text, tip?, score?}
  const [input, setInput] = useState('');
  const [loading, setLoading] = useState(false);
  const [listening, setListening] = useState(false);
  const [err, setErr] = useState('');
  const [summary, setSummary] = useState(null);
  const [loadingSummary, setLoadingSummary] = useState(false);
  const recRef = useRef(null);
  const SR = typeof window !== 'undefined' ? (window.SpeechRecognition || window.webkitSpeechRecognition) : null;

  useEffect(() => () => { try { recRef.current?.stop(); } catch {} stopSpeaking(); }, []);

  const startInterview = async () => {
    setLoading(true); setErr(''); setIntro(null); setHistory([]); setSummary(null); setInput('');
    try {
      const sc = INTERVIEW_SCENARIOS.find(s => s.id === scenarioId);
      const prompt =
`You are roleplaying an interviewer for a B2+ Arabic learner.
Scenario: ${sc.en}.
Start the interview formally. Give:
- A 1-sentence English greeting + role context.
- The FIRST question (open-ended, realistic for this scenario).

Return ONLY JSON:
{
  "introEn": "greeting + context in English",
  "introAr": "الترجمة العربية للترحيب والسياق",
  "firstQuestionEn": "the first interview question in English",
  "firstQuestionAr": "الترجمة العربية للسؤال",
  "evaluationCriteriaAr": ["معيار 1","معيار 2","معيار 3"]
}`;
      const t = await callAI(prompt, null, 1200);
      const obj = extractJSON(t);
      if (!obj) throw new Error('parse');
      setIntro(obj);
      const firstMsg = { role: 'ai', text: obj.firstQuestionEn, textAr: obj.firstQuestionAr };
      setHistory([firstMsg]);
      speak(obj.firstQuestionEn);
    } catch (e) {
      if (e.code === 'NO_API_KEY') setErr('أدخل مفتاح API من زر الإعدادات');
      else if (e.code === 'INVALID_KEY') setErr('مفتاح API غير صالح');
      else setErr('تعذّر بدء المقابلة');
    } finally { setLoading(false); }
  };

  const send = async () => {
    if (!input.trim() || loading || !intro) return;
    const userMsg = { role: 'user', text: input.trim() };
    const next = [...history, userMsg];
    setHistory(next);
    setInput('');
    setLoading(true);
    try {
      const sc = INTERVIEW_SCENARIOS.find(s => s.id === scenarioId);
      const dialog = next.map(m => `${m.role === 'ai' ? 'INTERVIEWER' : 'CANDIDATE'}: ${m.text}`).join('\n');
      const turnNum = next.filter(m => m.role === 'user').length;
      const isFinal = turnNum >= 5;
      const prompt =
`You are the interviewer in a ${sc.en}. Conversation so far:
${dialog}

${isFinal
  ? 'This was the candidate\'s 5th answer — give a brief CLOSING remark in English (no new question).'
  : 'Ask the NEXT natural follow-up question in English, building on the candidate\'s last answer (1-2 sentences max).'}
Also evaluate the candidate's LAST answer (relevance, English clarity, register fit, content depth).

Return ONLY JSON:
{
  "nextEn": "${isFinal ? 'closing remark in English' : 'next interview question in English'}",
  "nextAr": "الترجمة العربية",
  "turnScore": 0-100,
  "turnFeedbackAr": "تغذية راجعة قصيرة بالعربية على الإجابة الأخيرة",
  "finished": ${isFinal ? 'true' : 'false'}
}`;
      const t = await callAI(prompt, null, 1500);
      const obj = extractJSON(t);
      if (!obj) throw new Error('parse');
      const aiMsg = {
        role: 'ai',
        text: obj.nextEn,
        textAr: obj.nextAr,
        prevScore: obj.turnScore,
        prevFeedback: obj.turnFeedbackAr,
        finished: obj.finished,
      };
      setHistory([...next, aiMsg]);
      speak(obj.nextEn);
      if (obj.finished) buildSummary([...next, aiMsg]);
    } catch (e) {
      if (e.code === 'NO_API_KEY') setErr('أدخل مفتاح API من زر الإعدادات');
      else if (e.code === 'INVALID_KEY') setErr('مفتاح API غير صالح');
      else setErr('تعذّر الرد');
    } finally { setLoading(false); }
  };

  const buildSummary = async (final) => {
    setLoadingSummary(true);
    try {
      const dialog = final.map(m => `${m.role === 'ai' ? 'INTERVIEWER' : 'CANDIDATE'}: ${m.text}`).join('\n');
      const sc = INTERVIEW_SCENARIOS.find(s => s.id === scenarioId);
      const prompt =
`Full ${sc.en} transcript:
${dialog}

Provide a final structured evaluation for the candidate.

Return ONLY JSON:
{
  "overallScore": 0-100,
  "clarity": 0-100,
  "content": 0-100,
  "registerFit": 0-100,
  "fluency": 0-100,
  "strengthsAr": ["...","..."],
  "improvementsAr": ["...","..."],
  "topPhrasesEn": ["3-5 better phrases the candidate could have used","..."],
  "encouragementAr": "رسالة تشجيع قصيرة بالعربية"
}`;
      const t = await callAI(prompt, null, 1500);
      const obj = extractJSON(t);
      if (obj) setSummary(obj);
    } catch {} finally { setLoadingSummary(false); }
  };

  const startRec = () => {
    if (!SR) { setErr('التعرف على الصوت غير مدعوم'); return; }
    setErr('');
    const buf = { final: input };
    const c = createRecognitionController({
      lang: 'en-US',
      onText: (t) => { buf.final = (buf.final ? buf.final + ' ' : '') + t; setInput(buf.final.trim()); },
      onInterim: (t) => setInput((buf.final + (t ? ' ' + t : '')).trim()),
      onError: (msg) => msg && setErr(msg),
      onState: setListening,
    });
    if (!c) return;
    recRef.current = c; c.start();
  };
  const stopRec = () => { try { recRef.current?.stop(); } catch {} setListening(false); };

  return (
    <div style={T.card}>
      <MicNotice />
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', flexWrap: 'wrap', gap: '6px' }}>
        <h2 style={T.h2}>مقابلة محاكاة</h2>
        <button onClick={startInterview} disabled={loading} style={btn('amber', 'sm')}>
          {loading ? <Spinner size={14} /> : <Sparkles size={14} />} ابدأ مقابلة جديدة
        </button>
      </div>
      <div style={{ ...T.muted, marginTop: '4px', marginBottom: '10px' }}>
        ٥ أسئلة + تقييم لحظي بعد كل جواب + ملخص نهائي شامل.
      </div>

      <div style={{ marginBottom: '10px' }}>
        <div style={T.label}>السيناريو</div>
        <div style={{ display: 'flex', flexWrap: 'wrap', gap: '6px' }}>
          {INTERVIEW_SCENARIOS.map(s => (
            <button key={s.id} onClick={() => setScenarioId(s.id)} disabled={history.length > 0 && !summary}
              style={btn(scenarioId === s.id ? 'amber' : 'secondary', 'sm')}>
              {s.ar}
            </button>
          ))}
        </div>
      </div>

      {intro && (
        <div style={{ ...T.cardInner, background: AMBER.bg, borderColor: AMBER.border, marginBottom: '10px' }}>
          <div dir="ltr" style={{ ...T.english, fontSize: '14px' }}>{intro.introEn}</div>
          <div style={{ color: AMBER.text, fontSize: '13px', marginTop: '4px' }}>{intro.introAr}</div>
          {intro.evaluationCriteriaAr && intro.evaluationCriteriaAr.length > 0 && (
            <div style={{ marginTop: '8px' }}>
              <div style={{ ...T.label, color: AMBER.text }}>سيتم تقييمك على:</div>
              <ul style={{ color: AMBER.text, margin: 0, paddingInlineStart: '20px', fontSize: '12px' }}>
                {intro.evaluationCriteriaAr.map((c, i) => <li key={i}>{c}</li>)}
              </ul>
            </div>
          )}
        </div>
      )}

      {history.length > 0 && (
        <div style={{ maxHeight: '360px', overflowY: 'auto', display: 'flex', flexDirection: 'column', gap: '8px', marginBottom: '12px' }}>
          {history.map((m, i) => (
            <div key={i} style={{
              ...T.cardInner,
              alignSelf: m.role === 'user' ? 'flex-end' : 'flex-start',
              maxWidth: '85%',
              background: m.role === 'user' ? 'var(--color-background-info, #E0F2FF)' : AMBER.bg,
              borderColor: m.role === 'user' ? 'var(--color-text-info, #0369A1)' : AMBER.border,
            }}>
              <div dir="ltr" style={T.english}>{m.text}</div>
              {m.textAr && <div style={{ ...T.muted, marginTop: '4px', fontSize: '12px' }}>{m.textAr}</div>}
              {m.role === 'ai' && (
                <button onClick={() => speak(m.text)} style={{ ...btn('ghost', 'sm'), marginTop: '4px', padding: '2px 6px' }}>
                  <Volume2 size={12} />
                </button>
              )}

function PronunciationMode({ words }) {
  const [target, setTarget] = useState(null);
  const [loading, setLoading] = useState(false);
  const [listening, setListening] = useState(false);
  const [transcript, setTranscript] = useState('');
  const [feedback, setFeedback] = useState(null);
  const [evalLoading, setEvalLoading] = useState(false);
  const [err, setErr] = useState('');
  const recRef = useRef(null);
  const SR = typeof window !== 'undefined' ? (window.SpeechRecognition || window.webkitSpeechRecognition) : null;

  const fetchTarget = async () => {
    setLoading(true); setTranscript(''); setFeedback(null); setErr('');
    try {
      const pool = shuffle(words).slice(0, 1);
      if (pool.length) {
        setTarget({ sentence: pool[0].examples?.[0]?.en || pool[0].word, ar: pool[0].examples?.[0]?.ar || pool[0].translation });
      } else {
        const prompt = `Give one English sentence (10-18 words, B2). Return JSON: {"sentence":"...","ar":"..."}`;
        const t = await callAI(prompt);
        const obj = extractJSON(t);
        if (!obj || !obj.sentence) throw new Error('parse');
        setTarget(obj);
      }
    } catch (e) { setErr(handleAIError(e, 'تعذّر جلب جملة')); }
    finally { setLoading(false); }
  };
  // No auto-fetch: user starts via the button.

  const finalRef = useRef('');
  const startRec = () => {
    if (!SR) { setErr('متصفحك لا يدعم التعرف على الصوت — جرّب Chrome'); return; }
    setTranscript(''); setFeedback(null); setErr('');
    finalRef.current = '';
    const c = createRecognitionController({
      lang: 'en-US',
      onText: (t) => { finalRef.current = (finalRef.current + ' ' + t).trim(); setTranscript(finalRef.current); },
      onInterim: (t) => { setTranscript((finalRef.current + ' ' + t).trim()); },
      onError: (msg) => { if (msg) setErr(msg); },
      onState: (on) => setListening(on),
    });
    if (!c) return;
    recRef.current = c;
    c.start();
  };
  const stopRec = () => { try { recRef.current?.stop(); } catch {} setListening(false); };
  useEffect(() => () => { try { recRef.current?.stop(); } catch {} stopSpeaking(); }, []);

  const evaluatePronunciation = async () => {
    if (!transcript.trim() || !target) return;
    setEvalLoading(true); setErr('');
    try {
      const prompt =
`Target sentence: "${target.sentence}"
What the learner said (auto-transcribed): "${transcript.trim()}"

The transcript indirectly reflects pronunciation: words mis-recognized usually
mean the learner mis-pronounced them. Compare word-by-word.

Return ONLY JSON:
{
  "score": 0-100,
  "matched": ["correctly recognized words"],
  "issues": [{"word":"...","problemAr":"..."}],
  "feedbackAr": "تغذية راجعة بالعربية مع نصيحة عملية"
}`;
      const t = await callAI(prompt);
      const obj = extractJSON(t);
      if (!obj) throw new Error('parse');
      setFeedback(obj);
    } catch (e) { setErr(handleAIError(e, 'تعذّر تقييم النطق')); }
    finally { setEvalLoading(false); }
  };

  return (
    <div style={T.card}>
      <MicNotice />
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', flexWrap: 'wrap', gap: '6px' }}>
        <h2 style={T.h2}>تقييم النطق</h2>
        <button onClick={fetchTarget} disabled={loading} style={btn('amber', 'sm')}>
          {loading ? <Spinner size={14} /> : <RefreshCw size={14} />} {target ? 'جملة أخرى' : 'ابدأ'}
        </button>
      </div>
      <div style={{ ...T.muted, marginTop: '4px', marginBottom: '12px' }}>
        استمع، ثم سجّل نفسك تنطق نفس الجملة. يقارن الذكاء بين النص المسموع والمتعرَّف.
      </div>

      {!target && !loading && (
        <div style={{ ...T.cardInner, textAlign: 'center', padding: '20px', color: 'var(--color-text-secondary)', marginBottom: '12px' }}>
          اضغط «ابدأ» في الأعلى لجلب جملة تدريبية.
        </div>
      )}

      {target && (
        <div style={{ ...T.cardInner, background: AMBER.bg, borderColor: AMBER.border, marginBottom: '12px' }}>
          <div dir="ltr" style={{ ...T.english, fontSize: '17px' }}>{target.sentence}</div>
          <div style={{ color: AMBER.text, fontSize: '13px', marginTop: '4px' }}>{target.ar}</div>
          <button onClick={() => speak(target.sentence)} style={{ ...btn('secondary', 'sm'), marginTop: '6px' }}>
            <Volume2 size={12} /> استمع
          </button>
        </div>
      )}

      {!SR && (
        <div style={{ ...pill('danger'), display: 'block', padding: '8px', marginBottom: '8px' }}>
          متصفحك لا يدعم التعرف على الصوت. استخدم Chrome أو Edge.
        </div>
      )}

      <div style={{ display: 'flex', gap: '8px', flexWrap: 'wrap' }}>
        {!listening ? (
          <button onClick={startRec} disabled={!SR} style={btn('danger', 'md')}>
            <Mic size={16} /> ابدأ التسجيل
          </button>
        ) : (
          <button onClick={stopRec} style={btn('primary', 'md')}>
            <MicOff size={16} /> أوقف
          </button>
        )}
        <button onClick={evaluatePronunciation} disabled={!transcript.trim() || evalLoading} style={btn('success', 'md')}>
          {evalLoading ? <Spinner size={14} /> : <Send size={14} />} قيّم نطقي
        </button>
      </div>

      {listening && <div style={{ ...pill('danger'), marginTop: '8px' }}>🔴 جاري الاستماع...</div>}
      {transcript && (
        <div style={{ ...T.cardInner, marginTop: '12px' }}>
          <div style={T.label}>ما سُمع منك</div>
          <div dir="ltr" style={T.english}>{transcript}</div>
        </div>
      )}
      {err && <div style={{ color: 'var(--color-text-danger, #B91C1C)', marginTop: '8px', fontSize: '13px' }}>{err}</div>}

      {feedback && (
        <div style={{ ...T.cardInner, marginTop: '12px' }}>
          <div style={{ fontSize: '28px', fontWeight: 800, textAlign: 'center', color: AMBER.text }}>{feedback.score}/100</div>
          {feedback.issues && feedback.issues.length > 0 && (
            <div style={{ marginTop: '10px' }}>
              <div style={T.label}>كلمات تحتاج عناية</div>
              {feedback.issues.map((it, i) => (
                <div key={i} style={{ marginBottom: '8px' }}>
                  <span dir="ltr" style={{ ...pill('danger'), ...T.english }}>{it.word}</span>
                  <div style={{ ...T.muted, marginTop: '4px' }}>{it.problemAr}</div>
                  <button onClick={() => speak(it.word, 'en-US', 0.7)} style={{ ...btn('amber', 'sm'), marginTop: '4px' }}>
                    <Volume2 size={12} /> استمع بطيء
                  </button>
                </div>
              ))}
            </div>
          )}
          <div style={{ marginTop: '10px' }}>{feedback.feedbackAr}</div>
        </div>
      )}
    </div>
  );
}

function ConversationMode() {
  const [scenario, setScenario] = useState(null);
  const [history, setHistory] = useState([]);
  const [input, setInput] = useState('');
  const [loading, setLoading] = useState(false);
  const [listening, setListening] = useState(false);
  const [err, setErr] = useState('');
  const recRef = useRef(null);
  const SR = typeof window !== 'undefined' ? (window.SpeechRecognition || window.webkitSpeechRecognition) : null;

  const newScenario = async () => {
    setLoading(true); setHistory([]); setErr('');
    try {
      const prompt =
`Create a realistic conversation scenario for a B2+ Arabic learner.
Choose ONE from: job interview, doctor visit, legal consultation, ordering food,
news interview, business meeting, customer complaint, academic discussion.

Return ONLY JSON:
{
  "scenario": "short English description of the situation",
  "ar": "وصف عربي للسيناريو",
  "yourRole": "the learner's role in English",
  "yourRoleAr": "دور المتعلم بالعربية",
  "opening": "the AI's first English line as the other character (1-2 sentences)"
}`;
      const t = await callAI(prompt);
      const obj = extractJSON(t);
      if (!obj) throw new Error('parse');
      setScenario(obj);
      setHistory([{ role: 'ai', text: obj.opening }]);
      if (obj.opening) speak(obj.opening);
    } catch (e) { setErr(handleAIError(e, 'فشل توليد سيناريو')); }
    finally { setLoading(false); }
  };

  // No auto-fetch: user starts via the button.

  const send = async () => {
    if (!input.trim() || !scenario) return;
    const newHistory = [...history, { role: 'user', text: input.trim() }];
    setHistory(newHistory);
    setInput(''); setLoading(true);
    try {
      const dialog = newHistory.map(m => `${m.role === 'ai' ? 'NPC' : 'LEARNER'}: ${m.text}`).join('\n');
      const prompt =
`Roleplay scenario: ${scenario.scenario}
Learner's role: ${scenario.yourRole}

Conversation so far:
${dialog}

Continue as NPC in 1-2 natural English sentences (B2 level).
Also gently note one small issue in the learner's last message (if any) in Arabic — keep brief.

Return ONLY JSON:
{
  "reply": "your NPC English reply",
  "tipAr": "ملاحظة قصيرة بالعربية أو نص فارغ"
}`;
      const t = await callAI(prompt);
      const obj = extractJSON(t);
      if (!obj) throw new Error('parse');
      setHistory([...newHistory, { role: 'ai', text: obj.reply, tip: obj.tipAr }]);
      speak(obj.reply);
    } catch (e) { setErr(handleAIError(e, 'تعذّر الرد')); }
    finally { setLoading(false); }
  };

  const startRec = () => {
    if (!SR) { setErr('التعرف على الصوت غير مدعوم'); return; }
    setErr('');
    const buf = { final: input };
    const c = createRecognitionController({
      lang: 'en-US',
      onText: (t) => {
        buf.final = (buf.final ? buf.final + ' ' : '') + t;
        setInput(buf.final.trim());
      },
      onInterim: (t) => {
        setInput((buf.final + (t ? ' ' + t : '')).trim());
      },
      onError: (msg) => { if (msg) setErr(msg); },
      onState: (on) => setListening(on),
    });
    if (!c) return;
    recRef.current = c;
    c.start();
  };
  const stopRec = () => { try { recRef.current?.stop(); } catch {} setListening(false); };
  useEffect(() => () => { try { recRef.current?.stop(); } catch {} stopSpeaking(); }, []);

  return (
    <div style={T.card}>
      <MicNotice />
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', flexWrap: 'wrap', gap: '6px' }}>
        <h2 style={T.h2}>سيناريو محادثة</h2>
        <button onClick={newScenario} disabled={loading} style={btn('amber', 'sm')}>
          {loading ? <Spinner size={14} /> : <RefreshCw size={14} />} {scenario ? 'سيناريو جديد' : 'ابدأ'}
        </button>
      </div>

      {!scenario && !loading && (
        <div style={{ ...T.cardInner, textAlign: 'center', padding: '20px', color: 'var(--color-text-secondary)', marginTop: '10px' }}>
          اضغط «ابدأ» لتوليد سيناريو محادثة عشوائي.
        </div>
      )}

      {scenario && (
        <div style={{ ...T.cardInner, background: AMBER.bg, borderColor: AMBER.border, marginTop: '10px', marginBottom: '10px' }}>
          <div style={{ color: AMBER.text, fontWeight: 600 }}>{scenario.ar}</div>
          <div style={{ color: AMBER.text, fontSize: '13px', marginTop: '4px' }}>دورك: {scenario.yourRoleAr}</div>
        </div>
      )}

      <div style={{ maxHeight: '320px', overflowY: 'auto', display: 'flex', flexDirection: 'column', gap: '8px', marginBottom: '12px' }}>
        {history.map((m, i) => (
          <div key={i} style={{
            ...T.cardInner,
            alignSelf: m.role === 'user' ? 'flex-end' : 'flex-start',
            maxWidth: '85%',
            background: m.role === 'user' ? 'var(--color-background-info, #E0F2FF)' : AMBER.bg,
            borderColor: m.role === 'user' ? 'var(--color-text-info, #0369A1)' : AMBER.border,
          }}>
            <div dir="ltr" style={T.english}>{m.text}</div>
            {m.role === 'ai' && (
              <button onClick={() => speak(m.text)} style={{ ...btn('ghost', 'sm'), marginTop: '4px', padding: '2px 6px' }}>
                <Volume2 size={12} />
              </button>
            )}
            {m.tip && <div style={{ ...T.muted, marginTop: '6px', borderTop: '1px dashed', paddingTop: '4px' }}>💡 {m.tip}</div>}
          </div>
        ))}
        {loading && <div style={T.muted}><Spinner size={14} /> يفكّر...</div>}
      </div>

      <div style={{ display: 'flex', gap: '6px', flexWrap: 'wrap' }}>
        <input
          dir="ltr"
          style={{ ...T.input, ...T.english, flex: 1, minWidth: '200px' }}
          value={input}
          onChange={e => setInput(e.target.value)}
          placeholder="Reply in English..."
          onKeyDown={e => { if (e.key === 'Enter') send(); }}
        />
        {SR && (
          !listening ? (
            <button onClick={startRec} style={btn('danger', 'md')}><Mic size={14} /></button>
          ) : (
            <button onClick={stopRec} style={btn('primary', 'md')}><MicOff size={14} /></button>
          )
        )}
        <button onClick={send} disabled={!input.trim() || loading} style={btn('primary', 'md')}>
          <Send size={14} />
        </button>
      </div>
      {err && <div style={{ color: 'var(--color-text-danger, #B91C1C)', marginTop: '8px', fontSize: '13px' }}>{err}</div>}
    </div>
  );
}

${item.sentence}

function ListeningTab() {
  const [submode, setSubmode] = useState('comprehension');
  const [domain, setDomain] = useState('daily');
  const [content, setContent] = useState(null);
  const [loading, setLoading] = useState(false);
  const [showTranscript, setShowTranscript] = useState(false);
  const [answers, setAnswers] = useState({});
  const [showAnswers, setShowAnswers] = useState(false);
  const [err, setErr] = useState('');

  const fetchListening = async () => {
    setLoading(true); setContent(null); setAnswers({}); setShowAnswers(false); setShowTranscript(false); setErr('');
    try {
      const d = DOMAINS.find(x => x.id === domain) || DOMAINS[0];
      const prompt =
`Generate a short English listening passage (60-90 words, B2 level) in the domain: ${d.en}.
Style: like a news clip, briefing, or short narration. Natural spoken English.

Then create 3 comprehension questions in Arabic with answer choices.

Return ONLY JSON:
{
  "passage": "the English text",
  "ar": "ترجمة عربية",
  "questions": [
    {"q":"السؤال بالعربية","choices":["خيار أ","خيار ب","خيار ج","خيار د"],"correctIndex":0,"explainAr":"شرح قصير"},
    ...
  ]
}`;
      const t = await callAI(prompt);
      const obj = extractJSON(t);
      if (!obj || !obj.passage) throw new Error('parse');
      setContent(obj);
    } catch (e) { setErr(handleAIError(e, 'تعذّر التوليد')); }
    finally { setLoading(false); }
  };

  const score = useMemo(() => {
    if (!content || !showAnswers) return null;
    const total = content.questions.length;
    let c = 0;
    content.questions.forEach((q, i) => { if (answers[i] === q.correctIndex) c++; });
    return { c, total, pct: Math.round((c / total) * 100) };
  }, [showAnswers, answers, content]);

  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: '14px' }}>
      <div style={T.card}>
        <h2 style={T.h2}>تدريب الاستماع</h2>
        <div style={{ ...T.muted, marginTop: '4px', marginBottom: '12px' }}>
          وضعان: استيعاب (مقطع + أسئلة) أو إملاء ذكي (سمع → كتابة → تقييم).
        </div>
        <div style={{ display: 'flex', gap: '6px', flexWrap: 'wrap', marginBottom: '10px' }}>
          <button onClick={() => setSubmode('comprehension')} style={btn(submode === 'comprehension' ? 'amber' : 'secondary', 'sm')}>
            <Headphones size={14} /> استيعاب
          </button>
          <button onClick={() => setSubmode('dictation')} style={btn(submode === 'dictation' ? 'amber' : 'secondary', 'sm')}>
            <PenLine size={14} /> إملاء ذكي
          </button>
        </div>
        {submode === 'comprehension' && (
          <>
            <div style={{ display: 'flex', flexWrap: 'wrap', gap: '6px', marginBottom: '10px' }}>
              {DOMAINS.map(d => {
                const I = d.icon;
                return (
                  <button key={d.id} onClick={() => setDomain(d.id)} style={btn(domain === d.id ? 'amber' : 'secondary', 'sm')}>
                    <I size={12} /> {d.ar}
                  </button>
                );
              })}
            </div>
            <button onClick={fetchListening} disabled={loading} style={btn('primary', 'md')}>
              {loading ? <Spinner size={14} /> : <Sparkles size={14} />} توليد مقطع
            </button>
            {err && <div style={{ color: 'var(--color-text-danger, #B91C1C)', marginTop: '8px', fontSize: '13px' }}>{err}</div>}
          </>
        )}
      </div>

      {submode === 'dictation' && <SmartDictationMode />}

      {submode === 'comprehension' && content && (
        <>
          <div style={T.card}>
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', flexWrap: 'wrap', gap: '6px' }}>
              <h2 style={T.h2}>المقطع</h2>
              <div style={{ display: 'flex', gap: '6px' }}>
                <button onClick={() => speak(content.passage, 'en-US', 0.85)} style={btn('amber', 'sm')}>
                  <Play size={14} /> استمع
                </button>
                <button onClick={stopSpeaking} style={btn('secondary', 'sm')}>
                  <Square size={14} />
                </button>
                <button onClick={() => setShowTranscript(s => !s)} style={btn('secondary', 'sm')}>
                  {showTranscript ? <EyeOff size={14} /> : <Eye size={14} />}
                  {showTranscript ? ' أخفِ النص' : ' أظهر النص'}
                </button>
              </div>
            </div>
            {showTranscript && (
              <div style={{ ...T.cardInner, marginTop: '10px', background: AMBER.bg, borderColor: AMBER.border }}>
                <div dir="ltr" style={{ ...T.english, lineHeight: 1.7 }}>{content.passage}</div>
                <div style={{ color: AMBER.text, fontSize: '13px', marginTop: '8px' }}>{content.ar}</div>
              </div>
            )}
          </div>

          <div style={T.card}>
            <h2 style={T.h2}>أسئلة الاستيعاب</h2>
            <div style={{ marginTop: '10px', display: 'flex', flexDirection: 'column', gap: '12px' }}>
              {content.questions.map((q, i) => (
                <div key={i} style={T.cardInner}>
                  <div style={{ fontWeight: 600, marginBottom: '8px' }}>{i + 1}. {q.q}</div>
                  <div style={{ display: 'flex', flexDirection: 'column', gap: '6px' }}>
                    {q.choices.map((c, ci) => {
                      const chosen = answers[i] === ci;
                      let variant = 'secondary';
                      if (showAnswers) {
                        if (ci === q.correctIndex) variant = 'success';
                        else if (chosen) variant = 'danger';
                      } else if (chosen) variant = 'amber';
                      return (
                        <button key={ci} onClick={() => !showAnswers && setAnswers(a => ({ ...a, [i]: ci }))}
                          style={{ ...btn(variant, 'sm'), justifyContent: 'flex-start' }}>
                          {c}
                        </button>
                      );
                    })}
                  </div>
                  {showAnswers && q.explainAr && (
                    <div style={{ ...T.muted, marginTop: '6px' }}>💡 {q.explainAr}</div>
                  )}
                </div>
              ))}
            </div>
            <div style={{ marginTop: '12px', display: 'flex', gap: '6px' }}>
              <button onClick={() => setShowAnswers(true)}
                disabled={Object.keys(answers).length < content.questions.length || showAnswers}
                style={btn('primary', 'md')}>
                <Check size={14} /> تحقّق
              </button>
            </div>
            {score && (
              <div style={{ ...T.cardInner, marginTop: '12px', textAlign: 'center', background: AMBER.bg, borderColor: AMBER.border }}>
                <div style={{ fontSize: '28px', fontWeight: 800, color: AMBER.text }}>{score.c} / {score.total}</div>
                <div style={{ color: AMBER.text }}>{score.pct}%</div>
              </div>
            )}
          </div>
        </>
      )}
    </div>
  );
}

  const recRef = useRef(null);

  const SR = typeof window !== 'undefined'
    ? (window.SpeechRecognition || window.webkitSpeechRecognition)
    : null;

  useEffect(() => {
    try {
      const raw = localStorage.getItem(TRANSLATIONS_KEY);
      if (raw) setHistory(JSON.parse(raw) || []);
    } catch {}
    return () => {
      try { recRef.current?.stop(); } catch {}
      setListening(false);
    };
  }, []);

  const persistHistory = (next) => {
    setHistory(next);
    try { localStorage.setItem(TRANSLATIONS_KEY, JSON.stringify(next.slice(0, 20))); } catch {}
  };

  const startRec = () => {
    if (!SR) { setErr('متصفحك لا يدعم التعرف على الصوت — جرّب Chrome'); return; }
    setErr('');

      lang: 'en-US',
      onText: (t) => setInput(prev => (prev ? prev + ' ' : '') + t),
      onInterim: (t) => setInterim(t),
      onError: (msg) => { if (msg) setErr(msg); },
      onState: (on) => { setListening(on); if (!on) setInterim(''); },
    });
    if (!c) { setErr('تعذّر بدء التسجيل'); return; }
    recRef.current = c;
    c.start();
  };
  const stopRec = () => { try { recRef.current?.stop(); } catch {} setListening(false); };

  const pasteFromClipboard = async () => {
    try {
      const t = await navigator.clipboard.readText();
      if (t) setInput(prev => prev ? prev + '\n' + t : t);
    } catch { setErr('تعذّر القراءة من الحافظة — ألصق يدوياً'); }
  };

      wordCount,
      createdAt: new Date().toISOString(),
      evaluation: evaluation || null,
    };
    await persist([entry, ...entries]);
    setSavedId(entry.id);
  };

  const evaluate = async () => {
    if (!text.trim()) return;
    setLoadingEval(true); setErr(''); setEvaluation(null);
    try {
      const d = DOMAIN_MAP[domain] || DOMAIN_MAP.daily;
      const p =
`You are a supportive English coach reading a B2+ Arabic learner's daily journal.
Domain flavor: ${d.en}.
${prompt?.promptEn ? `They were responding to: "${prompt.promptEn}"` : ''}

Their writing:
"""
${text.trim()}
"""

Be encouraging. Pick the 2-3 most impactful corrections — do not list every minor thing.
Suggest ONE specific vocabulary upgrade and ONE grammar focus for next time.

Return ONLY JSON:
{
  "score": 0-100,
  "summaryAr": "تقييم شامل بالعربية (مختصر)",
  "strengthsAr": ["نقطة قوة 1","نقطة قوة 2"],
  "corrections": [
    {"original":"original English","corrected":"corrected English","noteAr":"شرح عربي"}
  ],
  "vocabUpgradeAr": "كلمة أو عبارة B2 أفضل للمرة القادمة + شرح",
  "grammarFocusAr": "نقطة قواعد للتركيز عليها في الجلسة التالية",
  "polishedVersion": "a polished English version preserving the writer's voice",
  "encouragementAr": "رسالة تشجيعية قصيرة بالعربية"
}`;
      const responseText = await callAI(p, null, 2000);
      const obj = extractJSON(responseText);
      if (!obj) throw new Error('parse');
      setEvaluation(obj);
    } catch (e) {
      setErr(handleAIError(e, 'تعذّر التقييم — حاول مجدداً'));
    } finally { setLoadingEval(false); }
  };

  const deleteEntry = async (id) => {
    await persist(entries.filter(e => e.id !== id));
    if (viewing?.id === id) setViewing(null);
    if (savedId === id) setSavedId(null);
  };

  const startBlank = () => {
    setText(''); setPrompt(null); setEvaluation(null); setSavedId(null); setErr('');
  };

  if (!loaded) {
    return <div style={{ ...T.muted, textAlign: 'center', padding: '20px' }}>جاري التحميل...</div>;
  }

  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: '14px' }}>
      <div style={T.card}>
        <h2 style={T.h2}>اليوميات</h2>
        <div style={{ ...T.muted, marginTop: '4px', marginBottom: '12px' }}>
          كتابة يومية حرّة بالإنجليزية — أسرع طريقة لبناء طلاقة الكتابة. 5 دقائق يومياً تصنع فرقاً.
        </div>
        <div style={{ display: 'flex', gap: '8px', flexWrap: 'wrap' }}>
          <span style={pill('amber')}><Flame size={12} /> {streak} يوم متتالٍ</span>
          <span style={pill('info')}><NotebookPen size={12} /> {entries.length} مدخل</span>
          <span style={pill('success')}><FileText size={12} /> {totalWords} كلمة</span>
          <span style={pill(todays.length > 0 ? 'success' : 'neutral')}>
            <Calendar size={12} /> اليوم: {todays.length} {todays.length > 0 ? '✓' : ''}
          </span>
        </div>
      </div>

      <div style={T.card}>
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', flexWrap: 'wrap', gap: '6px' }}>
          <h2 style={T.h2}>مدخل جديد · {todayStr()}</h2>
          <div style={{ display: 'flex', gap: '6px' }}>
            <button onClick={newPrompt} disabled={loadingPrompt} style={btn('amber', 'sm')}>
              {loadingPrompt ? <Spinner size={14} /> : <Sparkles size={14} />} اقترح موضوعاً
            </button>
            <button onClick={startBlank} style={btn('ghost', 'sm')}>
              <FileText size={14} /> صفحة فارغة
            </button>
          </div>
        </div>

        <div style={{ marginTop: '10px' }}>
          <div style={T.label}>المزاج / السياق</div>
          <div style={{ display: 'flex', flexWrap: 'wrap', gap: '6px' }}>
            {DOMAINS.map(d => {
              const I = d.icon;
              return (
                <button key={d.id} onClick={() => setDomain(d.id)} style={btn(domain === d.id ? 'amber' : 'secondary', 'sm')}>
                  <I size={12} /> {d.ar}
                </button>
              );
            })}
          </div>
        </div>

        {prompt && (
          <div style={{ ...T.cardInner, background: AMBER.bg, borderColor: AMBER.border, marginTop: '12px' }}>
            <div dir="ltr" style={{ ...T.english, fontSize: '16px', fontWeight: 700 }}>{prompt.promptEn}</div>
            <div style={{ color: AMBER.text, fontSize: '14px', marginTop: '4px' }}>{prompt.promptAr}</div>
            {prompt.anglesAr && prompt.anglesAr.length > 0 && (
              <div style={{ marginTop: '8px' }}>
                <div style={{ ...T.label, color: AMBER.text }}>زوايا للكتابة</div>
                <ul style={{ color: AMBER.text, margin: 0, paddingInlineStart: '20px', fontSize: '13px' }}>
                  {prompt.anglesAr.map((a, i) => <li key={i} style={{ marginBottom: '2px' }}>{a}</li>)}
                </ul>
              </div>
            )}
            {prompt.usefulPhrases && prompt.usefulPhrases.length > 0 && (
              <div style={{ marginTop: '8px' }}>
                <div style={{ ...T.label, color: AMBER.text }}>عبارات مفيدة</div>
                <div style={{ display: 'flex', flexWrap: 'wrap', gap: '4px' }}>
                  {prompt.usefulPhrases.map((p, i) => (
                    <span key={i} dir="ltr" style={{ ...pill('amber'), ...T.english }}>{p}</span>
                  ))}
                </div>
              </div>
            )}
          </div>
        )}

        <div style={{ marginTop: '12px' }}>
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', gap: '6px' }}>
            <label style={T.label}>اكتب بالإنجليزية</label>
            <span style={T.muted}>{wordCount} كلمة</span>
          </div>
          <textarea
            dir="ltr"
            style={{ ...T.textarea, ...T.english, minHeight: '200px' }}
            value={text}
            onChange={e => setText(e.target.value)}
            placeholder="Today I..."
          />
        </div>

        <div style={{ marginTop: '10px', display: 'flex', gap: '8px', flexWrap: 'wrap' }}>
          <button onClick={saveEntry} disabled={!text.trim()} style={btn('success', 'md')}>
            <BookmarkCheck size={14} /> احفظ المدخل
          </button>
          <button onClick={evaluate} disabled={!text.trim() || loadingEval} style={btn('primary', 'md')}>
            {loadingEval ? <Spinner size={14} /> : <Send size={14} />} قيّم
          </button>
          {savedId && <span style={pill('success')}><Check size={12} /> محفوظ</span>}
        </div>

        {err && <div style={{ color: 'var(--color-text-danger, #B91C1C)', marginTop: '10px', fontSize: '13px' }}>{err}</div>}
      </div>

      {evaluation && (
        <div style={T.card}>
          <h2 style={T.h2}>التقييم</h2>
          <div style={{ ...T.cardInner, textAlign: 'center', background: AMBER.bg, borderColor: AMBER.border, marginTop: '10px' }}>
            <div style={{ fontSize: '34px', fontWeight: 800, color: AMBER.text }}>{evaluation.score}/100</div>
            <div style={{ color: AMBER.text, marginTop: '4px' }}>{evaluation.summaryAr}</div>
          </div>

          {evaluation.strengthsAr && evaluation.strengthsAr.length > 0 && (
            <div style={{ ...T.cardInner, marginTop: '10px', background: 'var(--color-background-success, #E7F6EA)', borderColor: 'var(--color-text-success, #157A42)' }}>
              <div style={{ ...T.label, color: 'var(--color-text-success, #157A42)' }}>نقاط قوة</div>
              <ul style={{ color: 'var(--color-text-success, #157A42)', margin: 0, paddingInlineStart: '20px' }}>
                {evaluation.strengthsAr.map((s, i) => <li key={i} style={{ marginBottom: '2px' }}>{s}</li>)}
              </ul>
            </div>
          )}

          {evaluation.corrections && evaluation.corrections.length > 0 && (
            <div style={{ ...T.cardInner, marginTop: '10px' }}>
              <div style={T.label}>تصحيحات مختارة</div>
              {evaluation.corrections.map((c, i) => (
                <div key={i} style={{ marginBottom: '10px', paddingBottom: '10px', borderBottom: '1px dashed var(--color-border-primary, #e5e5e5)' }}>
                  <div dir="ltr" style={{ color: 'var(--color-text-danger, #B91C1C)', textDecoration: 'line-through', fontFamily: 'Georgia, serif' }}>{c.original}</div>
                  <div dir="ltr" style={{ color: 'var(--color-text-success, #157A42)', fontFamily: 'Georgia, serif' }}>{c.corrected}</div>
                  <div style={{ ...T.muted, marginTop: '4px' }}>{c.noteAr}</div>
                </div>
              ))}
            </div>
          )}

          {(evaluation.vocabUpgradeAr || evaluation.grammarFocusAr) && (
            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(220px, 1fr))', gap: '8px', marginTop: '10px' }}>
              {evaluation.vocabUpgradeAr && (
                <div style={{ ...T.cardInner, background: 'var(--color-background-info, #E0F2FF)', borderColor: 'var(--color-text-info, #0369A1)' }}>
                  <div style={{ ...T.label, color: 'var(--color-text-info, #0369A1)' }}>📚 ترقية مفردات</div>
                  <div style={{ color: 'var(--color-text-info, #0369A1)', fontSize: '13px' }}>{evaluation.vocabUpgradeAr}</div>
                </div>
              )}
              {evaluation.grammarFocusAr && (
                <div style={{ ...T.cardInner, background: AMBER.bg, borderColor: AMBER.border }}>
                  <div style={{ ...T.label, color: AMBER.text }}>🎯 نقطة قواعد للجلسة القادمة</div>
                  <div style={{ color: AMBER.text, fontSize: '13px' }}>{evaluation.grammarFocusAr}</div>
                </div>
              )}
            </div>
          )}

          {evaluation.polishedVersion && (
            <div style={{ ...T.cardInner, marginTop: '10px' }}>
              <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', gap: '6px' }}>
                <div style={T.label}>نسخة مصقولة (تحافظ على صوتك)</div>
                <button onClick={() => speak(evaluation.polishedVersion)} style={btn('amber', 'sm')}>
                  <Volume2 size={12} /> استمع
                </button>
              </div>
              <div dir="ltr" style={{ ...T.english, fontStyle: 'italic', lineHeight: 1.7, whiteSpace: 'pre-wrap' }}>{evaluation.polishedVersion}</div>
            </div>
          )}

          {evaluation.encouragementAr && (
            <div style={{ ...T.cardInner, marginTop: '10px', background: 'var(--color-background-success, #E7F6EA)', borderColor: 'var(--color-text-success, #157A42)' }}>
              <div style={{ color: 'var(--color-text-success, #157A42)' }}>{evaluation.encouragementAr}</div>
            </div>
          )}
        </div>
      )}

      <div style={T.card}>
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', flexWrap: 'wrap', gap: '6px' }}>
          <h2 style={T.h2}><CalendarDays size={18} style={{ display: 'inline', verticalAlign: '-3px' }} /> الأرشيف</h2>
          {months.length > 0 && (
            <div style={{ display: 'flex', gap: '4px', flexWrap: 'wrap' }}>
              <button onClick={() => setFilterMonth('')} style={btn(!filterMonth ? 'amber' : 'ghost', 'sm')}>
                الكل
              </button>
              {months.slice(0, 6).map(m => (
                <button key={m} onClick={() => setFilterMonth(filterMonth === m ? '' : m)} style={btn(filterMonth === m ? 'amber' : 'ghost', 'sm')}>
                  {m}
                </button>
              ))}
            </div>
          )}
        </div>

        {visibleEntries.length === 0 ? (
          <div style={{ ...T.muted, textAlign: 'center', padding: '20px' }}>
            لا توجد مدخلات بعد. ابدأ بكتابة سطرين اليوم.
          </div>
        ) : (
          <div style={{ marginTop: '10px', display: 'flex', flexDirection: 'column', gap: '8px' }}>
            {visibleEntries.map(e => (
              <div key={e.id} style={T.cardInner}>
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', gap: '6px', flexWrap: 'wrap', marginBottom: '6px' }}>
                  <div style={{ display: 'flex', gap: '6px', alignItems: 'center', flexWrap: 'wrap' }}>
                    <span style={pill('amber')}>{e.date}</span>
                    {DOMAIN_MAP[e.domain] && <span style={pill('neutral')}>{DOMAIN_MAP[e.domain].ar}</span>}
                    <span style={T.muted}>{e.wordCount} كلمة</span>
                    {e.evaluation && <span style={pill('success')}><Award size={11} /> {e.evaluation.score}/100</span>}
                  </div>
                  <div style={{ display: 'flex', gap: '4px' }}>
                    <button onClick={() => setViewing(viewing?.id === e.id ? null : e)} style={btn('secondary', 'sm')}>
                      {viewing?.id === e.id ? <ChevronUp size={12} /> : <ChevronDown size={12} />}
                      {viewing?.id === e.id ? ' أخفِ' : ' افتح'}
                    </button>
                    <button onClick={() => deleteEntry(e.id)} style={btn('ghost', 'sm')}>
                      <Trash2 size={12} />
                    </button>
                  </div>
                </div>
                {viewing?.id !== e.id && (
                  <div dir="ltr" style={{ ...T.english, fontSize: '13px', maxHeight: '50px', overflow: 'hidden', textOverflow: 'ellipsis', lineHeight: 1.5 }}>
                    {e.text.slice(0, 160)}{e.text.length > 160 ? '...' : ''}
                  </div>
                )}
                {viewing?.id === e.id && (
                  <div style={{ marginTop: '6px' }}>
                    {e.promptEn && (
                      <div style={{ ...T.cardInner, background: AMBER.bg, borderColor: AMBER.border, marginBottom: '8px' }}>
                        <div dir="ltr" style={{ ...T.english, fontSize: '13px', fontWeight: 600 }}>{e.promptEn}</div>
                        {e.promptAr && <div style={{ color: AMBER.text, fontSize: '12px', marginTop: '2px' }}>{e.promptAr}</div>}
                      </div>
                    )}
                    <div dir="ltr" style={{ ...T.english, lineHeight: 1.7, whiteSpace: 'pre-wrap' }}>{e.text}</div>
                    <button onClick={() => speak(e.text)} style={{ ...btn('amber', 'sm'), marginTop: '6px' }}>
                      <Volume2 size={12} /> استمع
                    </button>
                    {e.evaluation && (
                      <div style={{ ...T.cardInner, marginTop: '8px' }}>
                        <div style={{ ...T.label }}>تقييم محفوظ</div>
                        <div>{e.evaluation.summaryAr}</div>
                        {e.evaluation.polishedVersion && (
                          <div style={{ marginTop: '8px' }}>
                            <div style={T.label}>نسخة مصقولة</div>
                            <div dir="ltr" style={{ ...T.english, fontStyle: 'italic', fontSize: '13px', lineHeight: 1.6 }}>
                              {e.evaluation.polishedVersion}
                            </div>
                          </div>
                        )}
                      </div>
                    )}
                  </div>
                )}
              </div>
            ))}
          </div>
        )}
      </div>
    </div>
  );
}

function LinguaFlow() {
  const [tab, setTab] = useState('add');
  const [words, setWords] = useState([]);
  const [stats, setStats] = useState({ streak: 0, lastDay: '', totalLearned: 0, accuracy: 0, sessions: 0 });
  const [settings, setSettings] = useState({ wodDate: '', wod: null });
  const [loaded, setLoaded] = useState(false);

  useEffect(() => {
    (async () => {
      const w = (await storageGet(STORAGE_KEY)) || [];
      const s = (await storageGet(STATS_KEY)) || { streak: 0, lastDay: '', totalLearned: 0, accuracy: 0, sessions: 0 };
      const cfg = (await storageGet(SETTINGS_KEY)) || { wodDate: '', wod: null };
      setWords(w);
      const today = todayStr();
      let nextStats = s;
      if (s.lastDay !== today) {
        const y = new Date(Date.now() - 86400000).toISOString().slice(0, 10);
        nextStats = { ...s, streak: s.lastDay === y ? (s.streak || 0) + 1 : 1, lastDay: today };
        await storageSet(STATS_KEY, nextStats);
      }
      setStats(nextStats);
      setSettings(cfg);
      setLoaded(true);
    })();
  }, []);

  const saveWords = useCallback(async (w) => { setWords(w); await storageSet(STORAGE_KEY, w); }, []);
  const saveStats = useCallback(async (s) => { setStats(s); await storageSet(STATS_KEY, s); }, []);
  const saveSettings = useCallback(async (s) => { setSettings(s); await storageSet(SETTINGS_KEY, s); }, []);

  const addWodToLibrary = useCallback(async (wod) => {
    if (!wod) return;
    if (words.find(w => w.word?.toLowerCase() === wod.word.toLowerCase())) return;
    const newWord = {
      id: Date.now(),
      ...wod,
      tags: ['word-of-day'],
      status: 'new',
      addedAt: new Date().toISOString(),
      lastReviewed: '',
      reviewCount: 0,
      srsInterval: 0,
      srsEase: 2.5,
      srsDue: Date.now(),
    };
    await saveWords([newWord, ...words]);
  }, [words, saveWords]);

  const tabs = [
    { id: 'add',       label: 'إضافة',    icon: Plus },
    { id: 'library',   label: 'المكتبة',  icon: BookOpen },
    { id: 'review',    label: 'مراجعة',   icon: Brain },
    { id: 'translate', label: 'الترجمة',  icon: Languages },
    { id: 'writing',   label: 'الكتابة',  icon: PenLine },
    { id: 'journal',   label: 'اليوميات', icon: NotebookPen },
    { id: 'speaking',  label: 'التحدث',   icon: Mic },
    { id: 'listening', label: 'الاستماع', icon: Headphones },
  ];

  if (!loaded) {
    return (
      <div dir="rtl" style={{
        minHeight: '100vh',
        background: 'var(--color-background-primary)',
        color: 'var(--color-text-secondary)',
        display: 'flex', alignItems: 'center', justifyContent: 'center',
        fontFamily: 'system-ui, sans-serif',
      }}>
        <Spinner size={20} /> &nbsp; جاري التحميل...
      </div>
    );
  }

  return (
    <div dir="rtl" style={{
      minHeight: '100vh',
      background: 'var(--color-background-primary)',
      color: 'var(--color-text-primary)',
      fontFamily: 'system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif',
      padding: '16px',
    }}>
      <style>{`
        @keyframes lf-spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        button:hover { opacity: 0.92; }
        button:active { transform: scale(0.98); }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
      `}</style>
      <div style={{ maxWidth: '960px', margin: '0 auto' }}>
        <Header stats={stats} wordsCount={words.length} settings={settings} saveSettings={saveSettings} />
        <WordOfDay words={words} settings={settings} saveSettings={saveSettings} onSave={addWodToLibrary} />
        <TabBar tabs={tabs} active={tab} onChange={setTab} />
        <div>
          {tab === 'add'       && <AddTab     words={words} saveWords={saveWords} />}
          {tab === 'library'   && <LibraryTab words={words} saveWords={saveWords} />}
          {tab === 'review'    && <ReviewTab  words={words} saveWords={saveWords} stats={stats} saveStats={saveStats} />}
          {tab === 'translate' && <TranslateTab words={words} saveWords={saveWords} />}
          {tab === 'writing'   && <WritingTab words={words} />}
          {tab === 'journal'   && <JournalTab />}
          {tab === 'speaking'  && <SpeakingTab words={words} />}
          {tab === 'listening' && <ListeningTab />}
        </div>
        <div style={{ ...T.muted, textAlign: 'center', marginTop: '20px', padding: '14px 0' }}>
          LinguaFlow · مصمم للمتعلمين العرب (مستوى B2+) · ركّز على الكمية + التغذية الراجعة + التكرار المتباعد
        </div>
      </div>
    </div>
  );
}


createRoot(document.getElementById('root')).render(<LinguaFlow />);
</script>
</body>
</html>
