const TRANSLATIONS_KEY = 'linguaflow_translations_v1';

function TranslateTab({ words, saveWords }) {
  const [inputMode, setInputMode] = useState('paste');
  const [input, setInput] = useState('');
  const [interim, setInterim] = useState('');
  const [domain, setDomain] = useState('daily');
  const [listening, setListening] = useState(false);
  const [loading, setLoading] = useState(false);
  const [err, setErr] = useState('');
  const [result, setResult] = useState(null);
  const [showOriginal, setShowOriginal] = useState(true);
  const [addedWords, setAddedWords] = useState({});
  const [history, setHistory] = useState([]);
  const [historyOpen, setHistoryOpen] = useState(false);
  const recRef = useRef(null);

  const SR = typeof window !== 'undefined'
    ? (window.SpeechRecognition || window.webkitSpeechRecognition)
    : null;

  useEffect(() => {
    try {
      const raw = localStorage.getItem(TRANSLATIONS_KEY);
      if (raw) setHistory(JSON.parse(raw) || []);
    } catch {}
    return () => {
      try { recRef.current?.stop(); } catch {}
      setListening(false);
    };
  }, []);

  const persistHistory = (next) => {
    setHistory(next);
    try { localStorage.setItem(TRANSLATIONS_KEY, JSON.stringify(next.slice(0, 20))); } catch {}
  };

  const startRec = () => {
    if (!SR) { setErr('متصفحك لا يدعم التعرف على الصوت — جرّب Chrome'); return; }
    const r = new SR();
    r.lang = 'en-US';
    r.continuous = true;
    r.interimResults = true;
    r.maxAlternatives = 1;
    r.onresult = (e) => {
      let finalChunk = '';
      let interimChunk = '';
      for (let i = e.resultIndex; i < e.results.length; i++) {
        const t = e.results[i][0].transcript;
        if (e.results[i].isFinal) finalChunk += t + ' ';
        else interimChunk += t;
      }
      if (finalChunk) setInput(prev => (prev ? prev + ' ' : '') + finalChunk.trim());
      setInterim(interimChunk);
    };
    r.onerror = (e) => { setErr('خطأ في التعرف: ' + (e.error || '')); setListening(false); };
    r.onend = () => { setListening(false); setInterim(''); };
    try { r.start(); recRef.current = r; setListening(true); setErr(''); }
    catch (e) { setErr('تعذّر بدء التسجيل'); }
  };
  const stopRec = () => { try { recRef.current?.stop(); } catch {} setListening(false); };

  const pasteFromClipboard = async () => {
    try {
      const t = await navigator.clipboard.readText();
      if (t) setInput(prev => prev ? prev + '\n' + t : t);
    } catch { setErr('تعذّر القراءة من الحافظة — ألصق يدوياً'); }
  };

  const translate = async () => {
    if (!input.trim()) return;
    setLoading(true); setErr(''); setResult(null); setAddedWords({});
    try {
      const d = DOMAIN_MAP[domain] || DOMAIN_MAP.daily;
      const prompt =
`You are a contextual translation assistant for an Arabic-speaking B2+ learner.
The text is in the "${d.en}" context.

Return ONLY JSON (no fences, no commentary):
{
  "translation": "الترجمة العربية الكاملة، تراعي السياق التخصصي والاصطلاحات",
  "summary": "ملخص جملة-جملتان بالعربية",
  "keyTerms": [{"en":"term","ar":"ترجمة","explanationAr":"شرح في هذا السياق"}],
  "idioms": [{"phrase":"...","literalAr":"حرفياً","meaningAr":"المعنى الفعلي"}],
  "culturalNotes": "ملاحظات ثقافية/سياقية أو فارغ",
  "suggestedWords": [
    {"word":"...","definitionEn":"...","definitionAr":"...","exampleEn":"...","exampleAr":"...","domain":"${d.id}"}
  ]
}

Source:
"""
${input.trim()}
"""`;
      const text = await callAI(prompt, null, 3500);
      const obj = extractJSON(text);
      if (!obj || !obj.translation) throw new Error('parse');
      setResult(obj);
      const entry = {
        id: Date.now(),
        domain: d.id,
        source: input.trim(),
        result: obj,
        at: new Date().toISOString(),
      };
      persistHistory([entry, ...history].slice(0, 20));
    } catch (e) {
      if (e.code === 'NO_API_KEY') setErr('أدخل مفتاح API من زر الإعدادات');
      else if (e.code === 'INVALID_KEY') setErr('مفتاح API غير صالح — راجع الإعدادات');
      else setErr('تعذّرت الترجمة — حاول مجدداً');
    } finally { setLoading(false); }
  };

  const addSuggestedWord = async (sw, key) => {
    if (!sw || !sw.word) return;
    const exists = words.find(w => w.word?.toLowerCase() === sw.word.toLowerCase());
    if (exists) { setAddedWords(a => ({ ...a, [key]: 'exists' })); return; }
    const newWord = {
      id: Date.now() + Math.floor(Math.random() * 1000),
      word: sw.word,
      translation: sw.definitionAr || '',
      partOfSpeech: '',
      definition: sw.definitionEn || '',
      pronunciation: '',
      register: 'neutral',
      domain: sw.domain || domain,
      examples: (sw.exampleEn ? [{ en: sw.exampleEn, ar: sw.exampleAr || '' }] : []),
      collocations: [],
      synonyms: [],
      speakingTip: '',
      writingTip: '',
      commonMistake: '',
      tags: ['translate'],
      status: 'new',
      addedAt: new Date().toISOString(),
      lastReviewed: '',
      reviewCount: 0,
      srsInterval: 0,
      srsEase: 2.5,
      srsDue: Date.now(),
    };
    await saveWords([newWord, ...words]);
    setAddedWords(a => ({ ...a, [key]: 'added' }));
  };

  const restoreHistory = (entry) => {
    setInput(entry.source);
    setDomain(entry.domain);
    setResult(entry.result);
    setAddedWords({});
    setShowOriginal(true);
    setHistoryOpen(false);
  };
  const deleteHistory = (id) => {
    persistHistory(history.filter(h => h.id !== id));
  };

  const charCount = input.length;

  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: '14px' }}>
      <div style={T.card}>
        <h2 style={T.h2}>الترجمة السياقية</h2>
        <div style={{ ...T.muted, marginTop: '4px', marginBottom: '12px' }}>
          ألصق نصاً إنجليزياً أو سجّل من ميكروفونك (transcript من فيديو، مقال، خطاب)،
          واختر المجال للحصول على ترجمة تراعي السياق + مصطلحات + كلمات مقترحة.
        </div>

        <div style={{ display: 'flex', gap: '6px', flexWrap: 'wrap', marginBottom: '12px' }}>
          <button onClick={() => setInputMode('paste')} style={btn(inputMode === 'paste' ? 'amber' : 'secondary', 'sm')}>
            <ClipboardPaste size={14} /> لصق نص
          </button>
          {SR && (
            <button onClick={() => setInputMode('mic')} style={btn(inputMode === 'mic' ? 'amber' : 'secondary', 'sm')}>
              <Mic size={14} /> تسجيل من ميكروفون
            </button>
          )}
        </div>

        {inputMode === 'paste' && (
          <div>
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', gap: '8px', flexWrap: 'wrap' }}>
              <label style={T.label}>النص الإنجليزي</label>
              <button onClick={pasteFromClipboard} style={btn('ghost', 'sm')}>
                <ClipboardPaste size={12} /> من الحافظة
              </button>
            </div>
            <textarea
              dir="ltr"
              style={{ ...T.textarea, ...T.english, minHeight: '160px' }}
              value={input}
              onChange={e => setInput(e.target.value)}
              placeholder="ألصق النص الإنجليزي هنا (transcript من YouTube، مقال، إلخ)..."
            />
            <div style={{ ...T.muted, marginTop: '4px', textAlign: 'left' }}>
              {charCount} حرفاً
            </div>
          </div>
        )}

        {inputMode === 'mic' && (
          <div>
            <div style={{ ...T.muted, marginBottom: '8px' }}>
              💡 شغّل الفيديو/الصوت على جهازك واترك الميكروفون يلتقط. العبارات الطويلة مدعومة (التسجيل مستمر).
            </div>
            <div style={{ display: 'flex', gap: '8px', flexWrap: 'wrap', marginBottom: '8px' }}>
              {!listening ? (
                <button onClick={startRec} style={btn('danger', 'md')}>
                  <Mic size={14} /> ابدأ التسجيل
                </button>
              ) : (
                <button onClick={stopRec} style={btn('primary', 'md')}>
                  <MicOff size={14} /> أوقف
                </button>
              )}
              <button onClick={() => { setInput(''); setInterim(''); }} style={btn('secondary', 'md')}>
                <X size={14} /> امسح
              </button>
              {listening && <span style={pill('danger')}>🔴 جاري الاستماع...</span>}
            </div>
            <div dir="ltr" style={{
              ...T.cardInner,
              ...T.english,
              minHeight: '140px',
              maxHeight: '260px',
              overflowY: 'auto',
              whiteSpace: 'pre-wrap',
              lineHeight: 1.6,
            }}>
              {input}
              {interim && <span style={{ opacity: 0.5 }}> {interim}</span>}
              {!input && !interim && <span style={{ ...T.muted, fontStyle: 'italic' }}>(لم يلتقط نص بعد)</span>}
            </div>
            <div style={{ ...T.muted, marginTop: '4px', textAlign: 'left' }}>
              {charCount} حرفاً
            </div>
          </div>
        )}

        <div style={{ marginTop: '14px' }}>
          <div style={T.label}>السياق</div>
          <div style={{ display: 'flex', flexWrap: 'wrap', gap: '6px' }}>
            {DOMAINS.map(d => {
              const I = d.icon;
              return (
                <button key={d.id} onClick={() => setDomain(d.id)} style={btn(domain === d.id ? 'amber' : 'secondary', 'sm')}>
                  <I size={12} /> {d.ar}
                </button>
              );
            })}
          </div>
        </div>

        <div style={{ marginTop: '14px', display: 'flex', gap: '8px', flexWrap: 'wrap' }}>
          <button onClick={translate} disabled={!input.trim() || loading} style={btn('primary', 'md')}>
            {loading ? <Spinner size={14} /> : <Languages size={14} />} ترجم
          </button>
          {(input || result) && (
            <button onClick={() => { setInput(''); setResult(null); setErr(''); setAddedWords({}); setInterim(''); }} style={btn('ghost', 'md')}>
              <X size={14} /> مسح الكل
            </button>
          )}
        </div>

        {err && <div style={{ color: 'var(--color-text-danger, #B91C1C)', marginTop: '10px', fontSize: '13px' }}>{err}</div>}
      </div>

      {result && (
        <>
          <div style={T.card}>
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '10px', flexWrap: 'wrap', gap: '6px' }}>
              <h2 style={T.h2}>الترجمة</h2>
              <div style={{ display: 'flex', gap: '6px' }}>
                <button onClick={() => setShowOriginal(s => !s)} style={btn('secondary', 'sm')}>
                  {showOriginal ? <EyeOff size={14} /> : <Eye size={14} />}
                  {showOriginal ? ' إخفاء الأصل' : ' إظهار الأصل'}
                </button>
                <button onClick={() => speak(input)} style={btn('amber', 'sm')}>
                  <Volume2 size={14} /> استمع
                </button>
                <button onClick={stopSpeaking} style={btn('ghost', 'sm')}>
                  <Square size={14} />
                </button>
              </div>
            </div>

            {showOriginal && (
              <div style={{ ...T.cardInner, marginBottom: '10px' }}>
                <div style={T.label}>النص الأصلي</div>
                <div dir="ltr" style={{ ...T.english, lineHeight: 1.7, whiteSpace: 'pre-wrap' }}>{input}</div>
              </div>
            )}

            <div style={{ ...T.cardInner, background: AMBER.bg, borderColor: AMBER.border }}>
              <div style={{ ...T.label, color: AMBER.text }}>الترجمة العربية</div>
              <div style={{ color: AMBER.text, lineHeight: 1.8, whiteSpace: 'pre-wrap' }}>{result.translation}</div>
            </div>

            {result.summary && (
              <div style={{ ...T.cardInner, marginTop: '10px', background: 'var(--color-background-info, #E0F2FF)', borderColor: 'var(--color-text-info, #0369A1)' }}>
                <div style={{ ...T.label, color: 'var(--color-text-info, #0369A1)' }}>الملخص</div>
                <div style={{ color: 'var(--color-text-info, #0369A1)' }}>{result.summary}</div>
              </div>
            )}
          </div>

          {result.keyTerms && result.keyTerms.length > 0 && (
            <div style={T.card}>
              <h2 style={T.h2}>المصطلحات الرئيسية</h2>
              <div style={{ marginTop: '10px', display: 'flex', flexDirection: 'column', gap: '10px' }}>
                {result.keyTerms.map((t, i) => (
                  <div key={i} style={T.cardInner}>
                    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', gap: '8px', flexWrap: 'wrap' }}>
                      <div dir="ltr" style={{ ...T.english, fontSize: '16px', fontWeight: 700 }}>{t.en}</div>
                      <button onClick={() => speak(t.en)} style={btn('ghost', 'sm')}>
                        <Volume2 size={12} />
                      </button>
                    </div>
                    <div style={{ marginTop: '4px' }}>
                      <span style={pill('amber')}>{t.ar}</span>
                    </div>
                    {t.explanationAr && (
                      <div style={{ ...T.muted, marginTop: '6px' }}>{t.explanationAr}</div>
                    )}
                  </div>
                ))}
              </div>
            </div>
          )}

          {result.idioms && result.idioms.length > 0 && (
            <div style={T.card}>
              <h2 style={T.h2}>عبارات اصطلاحية</h2>
              <div style={{ marginTop: '10px', display: 'flex', flexDirection: 'column', gap: '10px' }}>
                {result.idioms.map((id, i) => (
                  <div key={i} style={T.cardInner}>
                    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', gap: '8px', flexWrap: 'wrap' }}>
                      <div dir="ltr" style={{ ...T.english, fontSize: '15px', fontWeight: 600 }}>{id.phrase}</div>
                      <button onClick={() => speak(id.phrase)} style={btn('ghost', 'sm')}>
                        <Volume2 size={12} />
                      </button>
                    </div>
                    {id.literalAr && (
                      <div style={{ ...T.muted, marginTop: '4px', fontStyle: 'italic' }}>
                        حرفياً: {id.literalAr}
                      </div>
                    )}
                    {id.meaningAr && (
                      <div style={{ marginTop: '4px' }}>
                        <span style={pill('amber')}>المعنى الفعلي</span>{' '}
                        <span>{id.meaningAr}</span>
                      </div>
                    )}
                  </div>
                ))}
              </div>
            </div>
          )}

          {result.culturalNotes && result.culturalNotes.trim() && (
            <div style={T.card}>
              <h2 style={T.h2}>ملاحظات سياقية / ثقافية</h2>
              <div style={{ ...T.cardInner, marginTop: '10px', background: 'var(--color-background-success, #E7F6EA)', borderColor: 'var(--color-text-success, #157A42)' }}>
                <div style={{ color: 'var(--color-text-success, #157A42)' }}>{result.culturalNotes}</div>
              </div>
            </div>
          )}

          {result.suggestedWords && result.suggestedWords.length > 0 && (
            <div style={T.card}>
              <h2 style={T.h2}>كلمات مقترحة للحفظ</h2>
              <div style={{ ...T.muted, marginTop: '4px', marginBottom: '10px' }}>
                مصطلحات استخرجها الذكاء من النص — أضفها لمكتبتك لتدخل في دورة المراجعة.
              </div>
              <div style={{ display: 'flex', flexDirection: 'column', gap: '10px' }}>
                {result.suggestedWords.map((sw, i) => {
                  const key = `${sw.word}-${i}`;
                  const state = addedWords[key];
                  return (
                    <div key={key} style={T.cardInner}>
                      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', gap: '8px', flexWrap: 'wrap' }}>
                        <div style={{ flex: 1, minWidth: 0 }}>
                          <div dir="ltr" style={{ ...T.english, fontSize: '17px', fontWeight: 700 }}>{sw.word}</div>
                          {sw.definitionEn && (
                            <div dir="ltr" style={{ ...T.muted, fontFamily: 'Georgia, serif', fontStyle: 'italic', marginTop: '2px' }}>
                              {sw.definitionEn}
                            </div>
                          )}
                          {sw.definitionAr && (
                            <div style={{ fontSize: '14px', marginTop: '4px' }}>{sw.definitionAr}</div>
                          )}
                          {sw.exampleEn && (
                            <div style={{ marginTop: '6px', paddingInlineStart: '8px', borderInlineStart: `2px solid ${AMBER.border}` }}>
                              <div dir="ltr" style={{ ...T.english, fontSize: '13px' }}>{sw.exampleEn}</div>
                              {sw.exampleAr && <div style={{ ...T.muted, fontSize: '12px' }}>{sw.exampleAr}</div>}
                            </div>
                          )}
                        </div>
                        <div style={{ display: 'flex', flexDirection: 'column', gap: '6px' }}>
                          <button onClick={() => speak(sw.word)} style={btn('ghost', 'sm')}>
                            <Volume2 size={12} />
                          </button>
                          {state === 'added' ? (
                            <span style={pill('success')}><Check size={12} /> أُضيفت</span>
                          ) : state === 'exists' ? (
                            <span style={pill('neutral')}>موجودة</span>
                          ) : (
                            <button onClick={() => addSuggestedWord(sw, key)} style={btn('amber', 'sm')}>
                              <Plus size={12} /> أضف
                            </button>
                          )}
                        </div>
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          )}
        </>
      )}

      <div style={T.card}>
        <button
          onClick={() => setHistoryOpen(o => !o)}
          style={{
            ...btn('ghost', 'md'),
            width: '100%',
            justifyContent: 'space-between',
            padding: '4px 0',
          }}
        >
          <span style={{ display: 'inline-flex', alignItems: 'center', gap: '6px' }}>
            <History size={14} /> سجل الترجمات ({history.length})
          </span>
          {historyOpen ? <ChevronUp size={14} /> : <ChevronDown size={14} />}
        </button>
        {historyOpen && (
          <div style={{ marginTop: '10px' }}>
            {history.length === 0 ? (
              <div style={{ ...T.muted, textAlign: 'center', padding: '12px' }}>لا توجد ترجمات محفوظة بعد.</div>
            ) : (
              <div style={{ display: 'flex', flexDirection: 'column', gap: '8px' }}>
                {history.map(h => {
                  const d = DOMAIN_MAP[h.domain];
                  return (
                    <div key={h.id} style={T.cardInner}>
                      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', gap: '6px', flexWrap: 'wrap', marginBottom: '4px' }}>
                        <div style={{ display: 'flex', gap: '6px', alignItems: 'center', flexWrap: 'wrap' }}>
                          {d && <span style={pill('amber')}>{d.ar}</span>}
                          <span style={T.muted}>{new Date(h.at).toLocaleString('ar')}</span>
                        </div>
                        <div style={{ display: 'flex', gap: '4px' }}>
                          <button onClick={() => restoreHistory(h)} style={btn('secondary', 'sm')}>
                            استعادة
                          </button>
                          <button onClick={() => deleteHistory(h.id)} style={btn('ghost', 'sm')}>
                            <Trash2 size={12} />
                          </button>
                        </div>
                      </div>
                      <div dir="ltr" style={{ ...T.english, fontSize: '13px', maxHeight: '60px', overflow: 'hidden', textOverflow: 'ellipsis' }}>
                        {h.source.slice(0, 200)}{h.source.length > 200 ? '...' : ''}
                      </div>
                    </div>
                  );
                })}
              </div>
            )}
          </div>
        )}
      </div>
    </div>
  );
}

function LinguaFlow() {
  const [tab, setTab] = useState('add');
  const [words, setWords] = useState([]);
  const [stats, setStats] = useState({ streak: 0, lastDay: '', totalLearned: 0, accuracy: 0, sessions: 0 });
  const [settings, setSettings] = useState({ wodDate: '', wod: null });
  const [loaded, setLoaded] = useState(false);

  useEffect(() => {
    (async () => {
      const w = (await storageGet(STORAGE_KEY)) || [];
      const s = (await storageGet(STATS_KEY)) || { streak: 0, lastDay: '', totalLearned: 0, accuracy: 0, sessions: 0 };
      const cfg = (await storageGet(SETTINGS_KEY)) || { wodDate: '', wod: null };
      setWords(w);
      const today = todayStr();
      let nextStats = s;
      if (s.lastDay !== today) {
        const y = new Date(Date.now() - 86400000).toISOString().slice(0, 10);
        nextStats = { ...s, streak: s.lastDay === y ? (s.streak || 0) + 1 : 1, lastDay: today };
        await storageSet(STATS_KEY, nextStats);
      }
      setStats(nextStats);
      setSettings(cfg);
      setLoaded(true);
    })();
  }, []);

  const saveWords = useCallback(async (w) => { setWords(w); await storageSet(STORAGE_KEY, w); }, []);
  const saveStats = useCallback(async (s) => { setStats(s); await storageSet(STATS_KEY, s); }, []);
  const saveSettings = useCallback(async (s) => { setSettings(s); await storageSet(SETTINGS_KEY, s); }, []);

  const addWodToLibrary = useCallback(async (wod) => {
    if (!wod) return;
    if (words.find(w => w.word?.toLowerCase() === wod.word.toLowerCase())) return;
    const newWord = {
      id: Date.now(),
      ...wod,
      tags: ['word-of-day'],
      status: 'new',
      addedAt: new Date().toISOString(),
      lastReviewed: '',
      reviewCount: 0,
      srsInterval: 0,
      srsEase: 2.5,
      srsDue: Date.now(),
    };
    await saveWords([newWord, ...words]);
  }, [words, saveWords]);

  const tabs = [
    { id: 'add',       label: 'إضافة',    icon: Plus },
    { id: 'library',   label: 'المكتبة',  icon: BookOpen },
    { id: 'review',    label: 'مراجعة',   icon: Brain },
    { id: 'translate', label: 'الترجمة',  icon: Languages },
    { id: 'writing',   label: 'الكتابة',  icon: PenLine },
    { id: 'speaking',  label: 'التحدث',   icon: Mic },
    { id: 'listening', label: 'الاستماع', icon: Headphones },
  ];

  if (!loaded) {
    return (
      <div dir="rtl" style={{
        minHeight: '100vh',
        background: 'var(--color-background-primary)',
        color: 'var(--color-text-secondary)',
        display: 'flex', alignItems: 'center', justifyContent: 'center',
        fontFamily: 'system-ui, sans-serif',
      }}>
        <Spinner size={20} /> &nbsp; جاري التحميل...
      </div>
    );
  }

  return (
    <div dir="rtl" style={{
      minHeight: '100vh',
      background: 'var(--color-background-primary)',
      color: 'var(--color-text-primary)',
      fontFamily: 'system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif',
      padding: '16px',
    }}>
      <style>{`
        @keyframes lf-spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        button:hover { opacity: 0.92; }
        button:active { transform: scale(0.98); }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
      `}</style>
      <div style={{ maxWidth: '960px', margin: '0 auto' }}>
        <Header stats={stats} wordsCount={words.length} />
        <WordOfDay words={words} settings={settings} saveSettings={saveSettings} onSave={addWodToLibrary} />
        <TabBar tabs={tabs} active={tab} onChange={setTab} />
        <div>
          {tab === 'add'       && <AddTab     words={words} saveWords={saveWords} />}
          {tab === 'library'   && <LibraryTab words={words} saveWords={saveWords} />}
          {tab === 'review'    && <ReviewTab  words={words} saveWords={saveWords} stats={stats} saveStats={saveStats} />}
          {tab === 'translate' && <TranslateTab words={words} saveWords={saveWords} />}
          {tab === 'writing'   && <WritingTab words={words} />}
          {tab === 'speaking'  && <SpeakingTab words={words} />}
          {tab === 'listening' && <ListeningTab />}
        </div>
        <div style={{ ...T.muted, textAlign: 'center', marginTop: '20px', padding: '14px 0' }}>
          LinguaFlow · مصمم للمتعلمين العرب (مستوى B2+) · ركّز على الكمية + التغذية الراجعة + التكرار المتباعد
        </div>
      </div>
    </div>
  );
}


createRoot(document.getElementById('root')).render(<LinguaFlow />);
</script>
</body>
</html>
