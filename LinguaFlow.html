/* ---------- Storage (localStorage) ---------- */
async function storageGet(key) {
  try {
    const v = localStorage.getItem(key);
    return v ? JSON.parse(v) : null;
  } catch (e) { console.error('storage get', e); }
  return null;
}
async function storageSet(key, val) {
  try {
    localStorage.setItem(key, JSON.stringify(val));
  } catch (e) { console.error('storage set', e); }
}

/* ---------- AI helper ---------- */
const API_KEY_STORAGE = 'linguaflow_api_key';
function getApiKey() {
  try { return localStorage.getItem(API_KEY_STORAGE) || ''; } catch { return ''; }
}
async function callAI(userPrompt, systemPrompt, maxTokens = 1000) {
  const apiKey = getApiKey();
  if (!apiKey) {
    const err = new Error('NO_API_KEY');
    err.code = 'NO_API_KEY';
    throw err;
  }
  const body = {
    model: MODEL,
    max_tokens: maxTokens,
    messages: [{ role: 'user', content: userPrompt }],
  };
  if (systemPrompt) body.system = systemPrompt;
  const res = await fetch(API_URL, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'x-api-key': apiKey,
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-access': 'true',
    },
    body: JSON.stringify(body),
  });
  if (!res.ok) {
    let detail = '';
    try { const j = await res.json(); detail = j?.error?.message || ''; } catch {}
    if (res.status === 401) {
      const err = new Error('INVALID_KEY');
      err.code = 'INVALID_KEY';
      throw err;
    }
    const err = new Error('API ' + res.status + (detail ? ' — ' + detail : ''));
    err.code = 'API_ERROR';
    throw err;
  }
  const data = await res.json();
  return data?.content?.[0]?.text || '';
}

function extractJSON(text) {
  if (!text) return null;
  const fenced = text.match(/```(?:json)?\s*([\s\S]*?)```/);
  const candidate = fenced ? fenced[1] : text;
  try { return JSON.parse(candidate); } catch {}
  const startO = candidate.indexOf('{');
  const startA = candidate.indexOf('[');
  let s = -1, close = '}';
  if (startO !== -1 && (startA === -1 || startO < startA)) { s = startO; close = '}'; }
  else if (startA !== -1) { s = startA; close = ']'; }
  if (s !== -1) {
    const e = candidate.lastIndexOf(close);
    if (e > s) { try { return JSON.parse(candidate.slice(s, e + 1)); } catch {} }
  }
  return null;
}

/* ---------- Unified AI error mapping ---------- */
function handleAIError(e, fallback = 'تعذّر الاتصال بالذكاء — حاول مجدداً') {
  if (!e) return fallback;
  if (e.code === 'NO_API_KEY') return 'أدخل مفتاح API من زر الإعدادات في الأعلى';
  if (e.code === 'INVALID_KEY') return 'مفتاح API غير صالح — راجع الإعدادات';
  if (e.code === 'API_ERROR') {
    const msg = (e.message || '').toLowerCase();
    if (msg.includes('429') || msg.includes('rate')) return 'تم تجاوز حدّ الاستخدام — انتظر دقيقة ثم حاول مجدداً';
    if (msg.includes('overloaded') || msg.includes('529')) return 'خوادم Claude مزدحمة الآن — أعد المحاولة بعد لحظات';
    if (msg.includes('500') || msg.includes('502') || msg.includes('503')) return 'خطأ مؤقت في الخادم — أعد المحاولة';
    return e.message ? `خطأ من الـ API: ${e.message}` : fallback;
  }
  if (e.message === 'parse') return 'استجابة الذكاء جاءت بصيغة غير متوقعة — حاول مجدداً';
  if ((e.message || '').toLowerCase().includes('failed to fetch')) return 'تعذّر الاتصال بالشبكة — تحقق من الإنترنت';
  return e.message ? `${fallback} (${e.message})` : fallback;
}

/* ---------- TTS ---------- */
const _tts = {
  voices: [],
  ready: false,
  selected: null,
  queue: [],
  speaking: false,
  listeners: new Set(),
  defaultRate: 0.95,
};

function _ttsLoadPref() {
  try {
    const raw = localStorage.getItem(SETTINGS_KEY);
    if (!raw) return '';
    const s = JSON.parse(raw);
    return s?.ttsVoiceURI || '';
  } catch { return ''; }
}

function _ttsPickBest() {
  const all = _tts.voices;
  if (!all.length) return null;
  const prefURI = _ttsLoadPref();
  if (prefURI) {
    const m = all.find(v => v.voiceURI === prefURI);
    if (m) return m;
  }
  const enUS = all.filter(v => /^en[-_]US/i.test(v.lang));
  const en   = all.filter(v => /^en[-_]/i.test(v.lang));
  const ranks = [
    v => /Google US English/i.test(v.name),
    v => /^Google/i.test(v.name),
    v => /Natural/i.test(v.name),
    v => /Online/i.test(v.name),
    v => /Microsoft/i.test(v.name) && /\(Natural\)/i.test(v.name),
    v => /^Microsoft (Aria|Jenny|Guy|Ana)/i.test(v.name),
    v => /^Microsoft/i.test(v.name),
    v => !v.localService,
    v => true,
  ];
  for (const list of [enUS, en]) {
    for (const r of ranks) {
      const m = list.find(r);
      if (m) return m;
    }
  }
  return all[0];
}

function _ttsRefresh() {
  if (!('speechSynthesis' in window)) return;
  _tts.voices = window.speechSynthesis.getVoices() || [];
  _tts.ready = _tts.voices.length > 0;
  _tts.selected = _ttsPickBest();
  try {
    const raw = localStorage.getItem(SETTINGS_KEY);
    if (raw) {
      const s = JSON.parse(raw);
      if (typeof s?.ttsRate === 'number' && s.ttsRate >= 0.5 && s.ttsRate <= 1.5) {
        _tts.defaultRate = s.ttsRate;
      }
    }
  } catch {}
  _tts.listeners.forEach(fn => { try { fn(); } catch {} });
}

if (typeof window !== 'undefined' && 'speechSynthesis' in window) {
  _ttsRefresh();
  try { window.speechSynthesis.addEventListener('voiceschanged', _ttsRefresh); } catch {}
  // Workaround for Chrome stalling after ~15s: keep the queue alive.
  setInterval(() => {
    try {
      if (window.speechSynthesis.speaking && !window.speechSynthesis.paused) {
        window.speechSynthesis.pause();
        window.speechSynthesis.resume();
      }
    } catch {}
  }, 10000);
}

function getTtsVoices() { return _tts.voices.slice(); }
function getTtsSelected() { return _tts.selected; }
function getTtsRate() { return _tts.defaultRate; }
function onTtsChange(fn) { _tts.listeners.add(fn); return () => _tts.listeners.delete(fn); }
function setTtsVoiceURI(uri) {
  const v = _tts.voices.find(x => x.voiceURI === uri);
  if (v) _tts.selected = v;
  else _tts.selected = _ttsPickBest();
  _tts.listeners.forEach(fn => { try { fn(); } catch {} });
}
function setTtsRateDefault(r) {
  const n = Number(r);
  if (Number.isFinite(n) && n >= 0.5 && n <= 1.5) _tts.defaultRate = n;
}
function isNaturalVoice(v) {
  if (!v) return false;
  return /Natural|Online|Google|Microsoft (Aria|Jenny|Guy|Ana|Eric|Roger|Steffan)/i.test(v.name || '');
}

function _ttsSplit(text, maxLen = 180) {
  const t = (text || '').trim();
  if (!t) return [];
  if (t.length <= maxLen) return [t];
  const sentences = t.match(/[^.!?\n]+[.!?]?[\s]*/g) || [t];
  const chunks = [];
  let buf = '';
  for (const raw of sentences) {
    const s = raw.trim();
    if (!s) continue;
    if (s.length > maxLen) {
      if (buf) { chunks.push(buf.trim()); buf = ''; }
      const parts = s.split(/,\s+|;\s+/);
      let sub = '';
      for (const p of parts) {
        if ((sub + ', ' + p).length > maxLen && sub) { chunks.push(sub.trim()); sub = p; }
        else sub = sub ? sub + ', ' + p : p;
      }
      if (sub.trim()) chunks.push(sub.trim());
      continue;
    }
    if ((buf + ' ' + s).length > maxLen && buf) {
      chunks.push(buf.trim()); buf = s;
    } else {
      buf = buf ? buf + ' ' + s : s;
    }
  }
  if (buf.trim()) chunks.push(buf.trim());
  return chunks;
}

function _ttsSpeakNext(lang, rate) {
  if (_tts.queue.length === 0) { _tts.speaking = false; return; }
  const chunk = _tts.queue.shift();
  const u = new SpeechSynthesisUtterance(chunk);
  u.lang = lang;
  u.rate = rate;
  u.pitch = 1.0;
  u.volume = 1.0;
  if (_tts.selected) u.voice = _tts.selected;
  u.onend = () => _ttsSpeakNext(lang, rate);
  u.onerror = () => _ttsSpeakNext(lang, rate);
  try { window.speechSynthesis.speak(u); }
  catch { _ttsSpeakNext(lang, rate); }
}

function speak(text, lang = 'en-US', rate) {
  try {
    if (!('speechSynthesis' in window) || !text) return;
    const effRate = (typeof rate === 'number' && rate > 0) ? rate : _tts.defaultRate;
    try { window.speechSynthesis.cancel(); } catch {}
    _tts.queue = _ttsSplit(text);
    _tts.speaking = true;
    // Small delay avoids Chrome's cancel→speak race condition.
    setTimeout(() => {
      if (!_tts.speaking) return;
      _ttsSpeakNext(lang, effRate);
    }, 90);
  } catch (e) { console.error(e); }
}
function stopSpeaking() {
  try {
    _tts.queue = [];
    _tts.speaking = false;
    if (window.speechSynthesis) window.speechSynthesis.cancel();
  } catch {}
}

/* ---------- Speech Recognition ---------- */
function getRecognition(opts = {}) {
  const SR = typeof window !== 'undefined'
    ? (window.SpeechRecognition || window.webkitSpeechRecognition)
    : null;
  if (!SR) return null;
  const r = new SR();
  r.lang = opts.lang || 'en-US';
  r.continuous = opts.continuous !== false; // default true for better capture
  r.interimResults = opts.interimResults !== false;
  r.maxAlternatives = opts.maxAlternatives || 1;
  return r;
}

function srErrorMessage(code) {
  switch (code) {
    case 'no-speech':     return 'لم يُلتقط كلام — تكلّم بصوت أوضح وقرّب الميكروفون.';
    case 'audio-capture': return 'لا يوجد ميكروفون متاح — تحقق من توصيله وإعدادات Windows.';
    case 'not-allowed':   return 'تم رفض إذن الميكروفون — اضغط أيقونة القفل في شريط العنوان واسمح بالميكروفون.';
    case 'network':       return 'مشكلة في الشبكة — التعرف على الصوت في Chrome يحتاج إنترنت.';
    case 'aborted':       return '';
    case 'service-not-allowed': return 'الخدمة غير متاحة في هذا المتصفح — جرّب Chrome.';
    default: return code ? ('خطأ في التعرف: ' + code) : 'خطأ في التعرف على الصوت';
  }
}

/* Wraps a SpeechRecognition with auto-restart while the user is still in
   "listening" mode (continuous mode can end on long silence). */
function createRecognitionController({ lang = 'en-US', onText, onInterim, onError, onState }) {
  const SR = typeof window !== 'undefined'
    ? (window.SpeechRecognition || window.webkitSpeechRecognition)
    : null;
  if (!SR) return null;
  let active = false;
  let restartCount = 0;
  let lastStart = 0;
  let r = null;

  const build = () => {
    const rec = new SR();
    rec.lang = lang;
    rec.continuous = true;
    rec.interimResults = true;
    rec.maxAlternatives = 1;
    rec.onresult = (e) => {
      let finalChunk = '';
      let interimChunk = '';
      for (let i = e.resultIndex; i < e.results.length; i++) {
        const t = e.results[i][0].transcript;
        if (e.results[i].isFinal) finalChunk += t + ' ';
        else interimChunk += t;
      }
      if (finalChunk && onText) onText(finalChunk.trim());
      if (onInterim) onInterim(interimChunk);
    };
    rec.onerror = (ev) => {
      const code = ev?.error || '';
      if (code === 'no-speech' || code === 'aborted') return; // benign; auto-restart will follow
      if (onError) onError(srErrorMessage(code), code);
      if (code === 'not-allowed' || code === 'service-not-allowed' || code === 'audio-capture') {
        active = false;
        if (onState) onState(false);
      }
    };
    rec.onend = () => {
      if (!active) { if (onState) onState(false); return; }
      const elapsed = Date.now() - lastStart;
      if (elapsed < 600) restartCount++; else restartCount = 0;
      if (restartCount > 8) { active = false; if (onState) onState(false); return; }
      try { lastStart = Date.now(); rec.start(); }
      catch { active = false; if (onState) onState(false); }
    };
    return rec;
  };

  return {
    start() {
      if (active) return;
      try {
        r = build();
        active = true;
        restartCount = 0;
        lastStart = Date.now();
        r.start();
        if (onState) onState(true);
      } catch (e) {
        active = false;
        if (onError) onError(srErrorMessage(e?.name || ''), e?.name || '');
        if (onState) onState(false);
      }
    },
    stop() {
      active = false;
      try { r && r.stop(); } catch {}
      if (onState) onState(false);
    },
    isActive() { return active; },
  };
}

/* ---------- SRS (SM-2 lite) ---------- */
function scheduleNext(word, quality) {
  const ease = word.srsEase || 2.5;
  const interval = word.srsInterval || 0;
  let newInt, newEase = ease, newStatus = word.status || 'new';
  if (quality === 0) { newInt = 1; newEase = Math.max(1.3, ease - 0.2); newStatus = 'review'; }
  else if (quality === 1) { newInt = Math.max(1, Math.round(Math.max(1, interval) * 1.2)); newEase = Math.max(1.3, ease - 0.15); newStatus = 'review'; }
  else if (quality === 2) { newInt = interval === 0 ? 2 : Math.round(interval * ease); newStatus = interval >= 14 ? 'known' : 'review'; }
  else { newInt = interval === 0 ? 4 : Math.round(interval * ease * 1.3); newEase = ease + 0.1; newStatus = 'known'; }
  return {
    ...word,
    srsInterval: newInt,
    srsEase: newEase,
    srsDue: Date.now() + newInt * 86400000,
    lastReviewed: new Date().toISOString(),
    reviewCount: (word.reviewCount || 0) + 1,
    status: newStatus,
  };
}
function isDue(w) {
  if (!w.srsDue) return true;
  return Date.now() >= w.srsDue;
}

/* ---------- Misc utils ---------- */
function todayStr() { return new Date().toISOString().slice(0, 10); }
function dayDiff(a, b) {
  const A = new Date(a), B = new Date(b);
  return Math.round((B - A) / 86400000);
}
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

const MIC_NOTICE_DISMISS_KEY = 'lf_mic_notice_dismissed_v1';

function MicNotice() {
  const isFile = typeof location !== 'undefined' && location.protocol === 'file:';
  const [dismissed, setDismissed] = useState(() => {
    try { return localStorage.getItem(MIC_NOTICE_DISMISS_KEY) === '1'; } catch { return false; }
  });
  const [permState, setPermState] = useState('');
  const [showCmd, setShowCmd] = useState(false);
  const [copied, setCopied] = useState(false);

  useEffect(() => {
    let cancelled = false;
    (async () => {
      try {
        if (navigator?.permissions?.query) {
          const r = await navigator.permissions.query({ name: 'microphone' });
          if (!cancelled) setPermState(r.state);
          r.onchange = () => { if (!cancelled) setPermState(r.state); };
        }
      } catch {}
    })();
    return () => { cancelled = true; };
  }, []);

  if (dismissed && !isFile && permState !== 'denied') return null;
  if (!isFile && permState !== 'denied') return null;

  const dismiss = () => {
    try { localStorage.setItem(MIC_NOTICE_DISMISS_KEY, '1'); } catch {}
    setDismissed(true);
  };
  const copyCmd = async () => {
    try { await navigator.clipboard.writeText('python -m http.server 5173'); setCopied(true); setTimeout(() => setCopied(false), 1500); } catch {}
  };

  const bg = permState === 'denied'
    ? 'var(--color-background-danger, #FCE7E7)'
    : AMBER.bg;
  const fg = permState === 'denied'
    ? 'var(--color-text-danger, #B91C1C)'
    : AMBER.text;
  const bd = permState === 'denied'
    ? 'var(--color-text-danger, #B91C1C)'
    : AMBER.border;

  return (
    <div style={{ ...T.cardInner, background: bg, borderColor: bd, marginBottom: '10px' }}>
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', gap: '8px' }}>
        <div style={{ flex: 1 }}>
          <div style={{ fontWeight: 700, color: fg, marginBottom: '4px' }}>
            {permState === 'denied'
              ? '🚫 إذن الميكروفون مرفوض'
              : '🎤 ملاحظة عن الميكروفون'}
          </div>
          {permState === 'denied' ? (
            <div style={{ color: fg, fontSize: '13px', lineHeight: 1.7 }}>
              تم رفض إذن الميكروفون لهذا الموقع. اضغط أيقونة القفل/المعلومات في شريط العنوان،
              ثم «إعدادات الموقع» → «الميكروفون: السماح»، ثم أعد تحميل الصفحة.
            </div>
          ) : (
            <div style={{ color: fg, fontSize: '13px', lineHeight: 1.7 }}>
              فتحت الملف مباشرة (<code style={{ ...T.english, fontSize: '12px' }}>file://</code>) — لذلك Chrome يطلب إذن
              الميكروفون في كل مرة. لحفظ الإذن دائماً، شغّل الملف عبر خادم محلي:
              <button onClick={() => setShowCmd(s => !s)} style={{ ...btn('ghost', 'sm'), padding: '0 6px', color: fg }}>
                {showCmd ? 'إخفاء التعليمات' : 'كيف؟'}
              </button>
            </div>
          )}
          {permState && permState !== 'denied' && (
            <div style={{ ...T.muted, color: fg, marginTop: '4px', fontSize: '12px' }}>
              حالة الإذن الحالية: <b>{permState}</b>
            </div>
          )}
          {showCmd && permState !== 'denied' && (
            <div style={{ marginTop: '8px', display: 'flex', gap: '6px', flexWrap: 'wrap', alignItems: 'center' }}>
              <code dir="ltr" style={{
                ...T.english, fontSize: '12px', background: 'rgba(0,0,0,0.06)',
                padding: '4px 8px', borderRadius: '4px',
              }}>
                cd &lt;مجلد الملف&gt; &amp;&amp; python -m http.server 5173
              </code>
              <button onClick={copyCmd} style={btn('secondary', 'sm')}>
                {copied ? <Check size={12} /> : <ClipboardPaste size={12} />}
                {copied ? ' نسخ تم' : ' انسخ'}
              </button>
              <span style={{ color: fg, fontSize: '12px' }}>ثم افتح <code style={T.english}>http://localhost:5173/LinguaFlow.html</code></span>
            </div>
          )}
        </div>
        {permState !== 'denied' && (
          <button onClick={dismiss} style={{ ...btn('ghost', 'sm'), color: fg }} title="إخفاء">
            <X size={14} />
          </button>
        )}
      </div>
    </div>
  );
}

function WordOfDay({ words, settings, saveSettings, onSave }) {
  const [loading, setLoading] = useState(false);
  const [err, setErr] = useState('');

  const today = todayStr();
  const wod = settings.wodDate === today ? settings.wod : null;

  const fetchWoD = useCallback(async () => {
    setLoading(true); setErr('');
    try {
      const knownWords = (words || []).slice(-30).map(w => w.word);
      const recentHistory = (settings.wodHistory || []).slice(0, 14);
      const recentDomains = recentHistory.map(h => h.domain);
      const recentItems = recentHistory.map(h => h.word);
      // Score each domain by how UNDERrepresented it is in recent history
      const counts = Object.fromEntries(DOMAINS.map(d => [d.id, 0]));
      recentDomains.forEach(d => { if (counts[d] != null) counts[d]++; });
      const sorted = DOMAINS.slice().sort((a, b) => counts[a.id] - counts[b.id]);
      // Pick from the 3 least-used domains, with a tiny date jitter
      const candidates = sorted.slice(0, 3);
      const pick = candidates[(new Date().getDate() + Math.floor(Math.random() * candidates.length)) % candidates.length];
      const domainHint = pick.en;
      const allowedRegisters = pick.id === 'academic'
        ? 'academic, formal, neutral'
        : 'neutral, informal, formal (NOT academic unless the domain truly demands it)';
      const prompt =
`Generate ONE useful English word OR multi-word phrase for an Arabic-speaking B2+ learner.

STRICT requirements:
- Domain MUST be: "${pick.id}" (${domainHint}). Do NOT default to academic unless the chosen domain is academic.
- Register should be ${allowedRegisters}. Prefer items a real person actually says/writes daily in that domain.
- Avoid abstract academic-flavored nouns unless the domain is academic.
- Pick something a B2 learner would realistically encounter on TV, in work emails, in a hospital, courtroom, conversation, etc. — not glossary jargon.

Avoid these recently-seen items: ${JSON.stringify([...knownWords, ...recentItems])}.

Return ONLY a JSON object with this exact schema (no markdown, no commentary):
{
  "word": "...",
  "translation": "ترجمة عربية موجزة",
  "partOfSpeech": "...",
  "definition": "simple B2 English definition",
  "pronunciation": "IPA",
  "register": "formal|informal|neutral|academic|legal|medical|business",
  "domain": "${pick.id}",
  "examples": [{"en":"...","ar":"..."},{"en":"...","ar":"..."},{"en":"...","ar":"..."}],
  "collocations": ["...","...","...","..."],
  "speakingTip": "نصيحة بالعربية لاستخدامه شفهياً",
  "writingTip": "نصيحة بالعربية للكتابة الرسمية أو غير الرسمية",
  "synonyms": ["...","..."],
  "commonMistake": "خطأ شائع يقع فيه المتحدث العربي"
}`;
      const text = await callAI(prompt);
      const obj = extractJSON(text);
      if (!obj || !obj.word) throw new Error('parse');
      if (!obj.domain) obj.domain = pick.id;
      const newHistory = [
        { word: obj.word, domain: obj.domain || pick.id, date: today },
        ...recentHistory,
      ].slice(0, 14);
      await saveSettings({ ...settings, wodDate: today, wod: obj, wodHistory: newHistory });
    } catch (e) {
      setErr('تعذّر جلب كلمة اليوم — حاول مجدداً');
    } finally { setLoading(false); }
  }, [words, settings, saveSettings, today]);

  useEffect(() => {
    if (settings.wodDate !== today && !loading) {
      fetchWoD();
    }
  }, [today]); // eslint-disable-line

  if (!wod && !loading && !err) return null;

  return (
    <div style={{
      ...T.card,
      background: `linear-gradient(135deg, ${AMBER.bg} 0%, var(--color-background-secondary) 100%)`,
      borderColor: AMBER.border,
      marginBottom: '14px',
    }}>
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '10px' }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: '8px' }}>
          <Star size={18} style={{ color: AMBER.text }} />
          <span style={{ fontWeight: 700, color: AMBER.text }}>كلمة اليوم</span>
          <span style={{ ...T.muted, color: AMBER.text }}>{today}</span>
        </div>
        <div style={{ display: 'flex', gap: '6px' }}>
          <button onClick={fetchWoD} disabled={loading} style={btn('secondary', 'sm')} title="كلمة أخرى">
            {loading ? <Spinner size={14} /> : <RefreshCw size={14} />}
          </button>
          {wod && (
            <button onClick={() => onSave(wod)} style={btn('amber', 'sm')}>
              <Plus size={14} /> أضف للمكتبة
            </button>
          )}
        </div>
      </div>
      {err && <div style={{ color: 'var(--color-text-danger, #B91C1C)', fontSize: '13px' }}>{err}</div>}
      {wod && <WordCard word={wod} />}
      {loading && !wod && <div style={T.muted}>جاري التحضير...</div>}
    </div>
  );
}

  const onAnalyze = async () => {
    if (!input.trim()) return;
    setLoading(true); setErr(''); setResult(null); setSaved(false);
    try {
      const prompt =
`You are an English tutor for an Arabic-speaking learner at B2+ (intermediate-upper).
Focus on practical use in speaking and writing across multiple domains
(daily, business, legal, medical, academic, military, political, economic, news, technology).

Input: "${input.trim()}"
${domainHint ? `User-hinted domain: ${domainHint}` : ''}

Return ONLY a JSON object (no markdown, no commentary) with this schema:
{
  "word": "the canonical English word/phrase",
  "translation": "ترجمة عربية موجزة",
  "partOfSpeech": "noun|verb|adjective|phrase|idiom|...",
  "definition": "simple B2 English definition",
  "pronunciation": "IPA",
  "register": "formal|informal|neutral|academic|legal|medical|business",
  "domain": "daily|business|legal|medical|academic|military|political|economic|news|technology",

    {"en":"natural example sentence","ar":"الترجمة"},
    {"en":"...","ar":"..."},

  "speakingTip": "نصيحة عربية: متى وكيف تستخدمها في الكلام",

}`;

    <div style={{ display: 'flex', flexDirection: 'column', gap: '14px' }}>

        </div>
        <label style={T.label}>الكلمة / العبارة</label>
        <input

        <div style={{ marginTop: '12px' }}>

          <div style={{ display: 'flex', flexWrap: 'wrap', gap: '6px' }}>
            <button

        </div>

/* ============================================================
   Library Tab
============================================================ */
function LibraryTab({ words, saveWords }) {
  const [q, setQ] = useState('');
  const [filter, setFilter] = useState('all');
  const [domainFilter, setDomainFilter] = useState('');
  const [tagFilter, setTagFilter] = useState('');
  const [selected, setSelected] = useState(null);
  const fileRef = useRef(null);

  const allTags = useMemo(() => {
    const s = new Set();
    words.forEach(w => (w.tags || []).forEach(t => s.add(t)));
    return Array.from(s);
  }, [words]);

  const filtered = useMemo(() => {
    return words.filter(w => {
      if (filter !== 'all' && w.status !== filter) return false;
      if (domainFilter && w.domain !== domainFilter) return false;
      if (tagFilter && !(w.tags || []).includes(tagFilter)) return false;
      if (q) {
        const t = q.toLowerCase();
        if (!w.word?.toLowerCase().includes(t) && !w.translation?.includes(q)) return false;
      }
      return true;
    });
  }, [words, q, filter, domainFilter, tagFilter]);

  const updateWord = async (id, patch) => {
    const next = words.map(w => w.id === id ? { ...w, ...patch } : w);
    await saveWords(next);
    if (selected && selected.id === id) setSelected({ ...selected, ...patch });
  };
  const deleteWord = async (id) => {
    await saveWords(words.filter(w => w.id !== id));
    if (selected && selected.id === id) setSelected(null);
  };

  const exportJSON = () => {
    const blob = new Blob([JSON.stringify(words, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `linguaflow-${todayStr()}.json`; a.click();
    URL.revokeObjectURL(url);
  };
  const exportCSV = () => {
    const head = 'word,translation,partOfSpeech,domain,status,pronunciation,addedAt';
    const rows = words.map(w =>
      [w.word, w.translation, w.partOfSpeech, w.domain, w.status, w.pronunciation, w.addedAt]
        .map(v => `"${(v || '').toString().replace(/"/g, '""')}"`).join(',')
    );
    const blob = new Blob([head + '\n' + rows.join('\n')], { type: 'text/csv' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `linguaflow-${todayStr()}.csv`; a.click();
    URL.revokeObjectURL(url);
  };
  const importFile = async (e) => {
    const f = e.target.files?.[0];
    if (!f) return;
    const text = await f.text();
    try {
      let incoming = [];
      if (f.name.endsWith('.json')) {
        const arr = JSON.parse(text);
        if (Array.isArray(arr)) incoming = arr;
      } else {
        const lines = text.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
        incoming = lines.map((line, i) => ({
          id: Date.now() + i,
          word: line,
          translation: '',
          status: 'new',
          addedAt: new Date().toISOString(),
          reviewCount: 0,
          examples: [],
        }));
      }
      const existingWords = new Set(words.map(w => w.word?.toLowerCase()));
      const fresh = incoming.filter(w => w.word && !existingWords.has(w.word.toLowerCase()));
      await saveWords([...fresh, ...words]);
      e.target.value = '';
      alert(`تم استيراد ${fresh.length} كلمة`);
    } catch {
      alert('ملف غير صالح');
    }
  };

  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: '14px' }}>
      <div style={T.card}>
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', flexWrap: 'wrap', gap: '8px' }}>
          <h2 style={T.h2}>مكتبتي ({words.length})</h2>
          <div style={{ display: 'flex', gap: '6px', flexWrap: 'wrap' }}>
            <button onClick={() => fileRef.current?.click()} style={btn('secondary', 'sm')}>
              <Upload size={14} /> استيراد
            </button>
            <input ref={fileRef} type="file" accept=".json,.txt,.csv" style={{ display: 'none' }} onChange={importFile} />
            <button onClick={exportJSON} style={btn('secondary', 'sm')}>
              <Download size={14} /> JSON
            </button>
            <button onClick={exportCSV} style={btn('secondary', 'sm')}>
              <Download size={14} /> CSV
            </button>
          </div>
        </div>

        <div style={{ marginTop: '12px', display: 'flex', gap: '8px', alignItems: 'center' }}>
          <Search size={16} style={{ color: 'var(--color-text-secondary)' }} />
          <input
            style={T.input}
            value={q}
            onChange={e => setQ(e.target.value)}
            placeholder="ابحث عن كلمة..."
          />
        </div>

        <div style={{ marginTop: '10px', display: 'flex', flexWrap: 'wrap', gap: '6px' }}>
          {[
            ['all', 'الكل'],
            ['new', 'جديدة'],
            ['review', 'مراجعة'],
            ['known', 'محفوظة'],
          ].map(([id, label]) => (
            <button key={id}
              onClick={() => setFilter(id)}
              style={btn(filter === id ? 'amber' : 'secondary', 'sm')}>
              {label}
            </button>
          ))}
        </div>

        <div style={{ marginTop: '8px', display: 'flex', flexWrap: 'wrap', gap: '6px' }}>
          <button onClick={() => setDomainFilter('')} style={btn(!domainFilter ? 'amber' : 'ghost', 'sm')}>
            كل المجالات
          </button>
          {DOMAINS.map(d => {
            const I = d.icon;
            return (
              <button key={d.id} onClick={() => setDomainFilter(d.id === domainFilter ? '' : d.id)}
                style={btn(domainFilter === d.id ? 'amber' : 'ghost', 'sm')}>
                <I size={12} /> {d.ar}
              </button>
            );
          })}
        </div>

        {allTags.length > 0 && (
          <div style={{ marginTop: '8px', display: 'flex', flexWrap: 'wrap', gap: '6px' }}>
            <span style={T.muted}>وسوم:</span>
            {allTags.map(t => (
              <button key={t}
                onClick={() => setTagFilter(t === tagFilter ? '' : t)}
                style={btn(tagFilter === t ? 'amber' : 'ghost', 'sm')}>
                <TagIcon size={12} /> {t}
              </button>
            ))}
          </div>
        )}
      </div>

      {filtered.length === 0 ? (
        <div style={{ ...T.card, textAlign: 'center', color: 'var(--color-text-secondary)' }}>
          لا توجد نتائج. ابدأ بإضافة كلمات من تبويب الإضافة.
        </div>
      ) : (
        <div style={{ display: 'grid', gap: '10px', gridTemplateColumns: 'repeat(auto-fill, minmax(220px, 1fr))' }}>
          {filtered.map(w => (
            <button key={w.id} onClick={() => setSelected(w)} style={{
              ...T.cardInner,
              textAlign: 'right',
              cursor: 'pointer',
              fontFamily: 'inherit',
              transition: 'transform 0.1s',
            }}>
              <div dir="ltr" style={{ ...T.english, fontSize: '17px', fontWeight: 700, marginBottom: '2px' }}>
                {w.word}
              </div>
              <div style={{ fontSize: '14px', marginBottom: '6px' }}>{w.translation}</div>
              <div style={{ display: 'flex', flexWrap: 'wrap', gap: '4px' }}>
                <span style={pill(w.status === 'known' ? 'success' : w.status === 'review' ? 'danger' : 'neutral')}>
                  {w.status === 'known' ? 'محفوظة' : w.status === 'review' ? 'مراجعة' : 'جديدة'}
                </span>
                {w.domain && DOMAIN_MAP[w.domain] && <span style={pill('amber')}>{DOMAIN_MAP[w.domain].ar}</span>}
              </div>
            </button>
          ))}
        </div>
      )}

      {selected && (
        <div style={T.card}>
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '10px' }}>
            <h2 style={T.h2}>تفاصيل الكلمة</h2>
            <button onClick={() => setSelected(null)} style={btn('ghost', 'sm')}>
              <X size={14} />
            </button>
          </div>
          <WordCard word={selected} />
          <div style={{ marginTop: '12px', display: 'flex', flexWrap: 'wrap', gap: '6px' }}>
            <button onClick={() => updateWord(selected.id, { status: 'review' })} style={btn('danger', 'sm')}>
              تحتاج مراجعة
            </button>
            <button onClick={() => updateWord(selected.id, { status: 'known' })} style={btn('success', 'sm')}>
              <Check size={14} /> حفظتها تماماً
            </button>
            <button onClick={() => deleteWord(selected.id)} style={btn('ghost', 'sm')}>
              <Trash2 size={14} /> حذف
            </button>
          </div>
        </div>
      )}
    </div>
  );
}

/* ============================================================
   Review Tab (SRS flashcards)
============================================================ */
function ReviewTab({ words, saveWords, stats, saveStats }) {
  const [deck, setDeck] = useState([]);
  const [idx, setIdx] = useState(0);
  const [flipped, setFlipped] = useState(false);
  const [done, setDone] = useState(false);
  const [results, setResults] = useState({ correct: 0, total: 0 });
  const [mode, setMode] = useState('srs');

  const startSession = useCallback(() => {
    if (words.length === 0) return;
    let pool;
    if (mode === 'srs') {
      pool = words.filter(isDue);
      if (pool.length === 0) pool = shuffle(words).slice(0, 10);
    } else {
      pool = shuffle(words);
    }
    setDeck(pool.slice(0, 10));
    setIdx(0); setFlipped(false); setDone(false);
    setResults({ correct: 0, total: 0 });
  }, [words, mode]);

  useEffect(() => { startSession(); }, [mode]); // eslint-disable-line

  const rate = async (quality) => {
    const cur = deck[idx];
    if (!cur) return;
    const updated = scheduleNext(cur, quality);
    const nextWords = words.map(w => w.id === cur.id ? updated : w);
    await saveWords(nextWords);
    const newResults = {
      correct: results.correct + (quality >= 2 ? 1 : 0),
      total: results.total + 1,
    };
    setResults(newResults);
    if (idx + 1 >= deck.length) {
      setDone(true);
      const acc = newResults.total > 0 ? (newResults.correct / newResults.total) * 100 : 0;
      const nSessions = stats.sessions + 1;
      const newAcc = (stats.accuracy * stats.sessions + acc) / nSessions;
      await saveStats({
        ...stats,
        sessions: nSessions,
        accuracy: newAcc,
        totalLearned: nextWords.filter(w => w.status === 'known').length,
      });
    } else {
      setIdx(idx + 1);
      setFlipped(false);
    }
  };

  if (words.length === 0) {
    return (
      <div style={{ ...T.card, textAlign: 'center', color: 'var(--color-text-secondary)' }}>
        أضف كلمات أولاً لتبدأ المراجعة.
      </div>
    );
  }

  if (done) {
    const acc = results.total > 0 ? Math.round((results.correct / results.total) * 100) : 0;
    return (
      <div style={{ ...T.card, textAlign: 'center' }}>
        <Award size={48} style={{ color: AMBER.text, margin: '0 auto 10px', display: 'block' }} />
        <h2 style={T.h2}>أنهيت الجلسة!</h2>
        <div style={{ fontSize: '36px', fontWeight: 800, margin: '12px 0', color: AMBER.text }}>
          {acc}%
        </div>
        <div style={T.muted}>{results.correct} / {results.total} كلمة بإجابات جيدة</div>
        <div style={{ marginTop: '14px', display: 'flex', gap: '8px', justifyContent: 'center', flexWrap: 'wrap' }}>
          <button onClick={startSession} style={btn('primary', 'md')}>
            <RefreshCw size={14} /> جلسة جديدة
          </button>
        </div>
      </div>
    );
  }

  const cur = deck[idx];
  if (!cur) return null;
  const progress = ((idx + (flipped ? 0.5 : 0)) / deck.length) * 100;
  const dueCount = words.filter(isDue).length;

  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: '14px' }}>
      <div style={T.card}>
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', flexWrap: 'wrap', gap: '8px' }}>
          <h2 style={T.h2}>المراجعة</h2>
          <div style={{ display: 'flex', gap: '6px', flexWrap: 'wrap' }}>
            <button onClick={() => setMode('srs')} style={btn(mode === 'srs' ? 'amber' : 'secondary', 'sm')}>
              <Brain size={14} /> تكرار متباعد ({dueCount} مستحقة)
            </button>
            <button onClick={() => setMode('shuffle')} style={btn(mode === 'shuffle' ? 'amber' : 'secondary', 'sm')}>
              <Shuffle size={14} /> عشوائي
            </button>
          </div>
        </div>
        <div style={{ marginTop: '12px', background: 'var(--color-background-primary)', height: '8px', borderRadius: '4px', overflow: 'hidden', border: '1px solid var(--color-border-primary, #e5e5e5)' }}>
          <div style={{ width: `${progress}%`, height: '100%', background: AMBER.border, transition: 'width 0.3s' }} />

        <div style={{ ...T.muted, marginTop: '6px', textAlign: 'center' }}>

      <div style={{ ...T.card, minHeight: '280px' }}>
        {!flipped ? (
          <div style={{ textAlign: 'center', padding: '20px 0' }}>
            <div dir="ltr" style={{ ...T.english, fontSize: '36px', fontWeight: 700, marginBottom: '10px' }}>
              {cur.word}
            </div>
            {cur.pronunciation && (

            <button onClick={() => speak(cur.word)} style={{ ...btn('amber', 'md'), marginTop: '12px' }}>

            </div>
          </div>

            <div style={{ textAlign: 'center', marginBottom: '12px' }}>
              <div dir="ltr" style={{ ...T.english, fontSize: '22px', fontWeight: 700 }}>{cur.word}</div>
              <div style={{ fontSize: '20px', fontWeight: 600, marginTop: '6px' }}>{cur.translation}</div>
            </div>
            {cur.definition && (
              <div dir="ltr" style={{ ...T.muted, fontStyle: 'italic', fontFamily: 'Georgia, serif', textAlign: 'center', marginBottom: '10px' }}>
                {cur.definition}
              </div>
            )}
            {cur.examples && cur.examples[0] && (
              <div style={{ ...T.cardInner, background: AMBER.bg, borderColor: AMBER.border, marginBottom: '14px' }}>
                <div dir="ltr" style={{ ...T.english, marginBottom: '4px' }}>{cur.examples[0].en}</div>
                <div style={{ ...T.muted, color: AMBER.text }}>{cur.examples[0].ar}</div>
              </div>
            )}
            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(120px, 1fr))', gap: '8px' }}>
              <button onClick={() => rate(0)} style={btn('danger', 'md')}>لم أعرفها</button>
              <button onClick={() => rate(1)} style={btn('secondary', 'md')}>صعبة</button>
              <button onClick={() => rate(2)} style={btn('info', 'md')}>جيد</button>
              <button onClick={() => rate(3)} style={btn('success', 'md')}>ممتاز</button>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

const STYLE_LEVELS = [
  { id: 'informal', ar: 'عامية',   en: 'informal' },
  { id: 'formal',   ar: 'رسمية',   en: 'formal' },
  { id: 'academic', ar: 'أكاديمية', en: 'academic' },
  { id: 'legal',    ar: 'قانونية', en: 'legal' },
];
const STYLE_LEVEL_MAP = Object.fromEntries(STYLE_LEVELS.map(l => [l.id, l]));

function StyleTransformMode() {
  const [submode, setSubmode] = useState('show');
  const [input, setInput] = useState('');
  const [versions, setVersions] = useState(null);
  const [loading, setLoading] = useState(false);
  const [err, setErr] = useState('');

  // practice state
  const [targetLevel, setTargetLevel] = useState('formal');
  const [userText, setUserText] = useState('');
  const [evaluation, setEvaluation] = useState(null);
  const [loadingEval, setLoadingEval] = useState(false);
  const [showModel, setShowModel] = useState(false);

  const generate = async () => {
    if (!input.trim()) return;
    setLoading(true); setErr(''); setVersions(null);
    try {
      const prompt =
`Rewrite the following English text in FOUR distinct registers for a B2+ Arabic learner.
Levels: informal (everyday/colloquial), formal (professional), academic (scholarly), legal (contract/court phrasing).
Each version must convey the same core meaning but use vocabulary, sentence structure, and tone appropriate to its level.
For each, add a short Arabic note describing what changed (vocabulary, sentence structure, register markers).

Return ONLY JSON (no fences):
{
  "versions": [
    {"level":"informal","en":"...","ar":"الترجمة العربية","noteAr":"ما الذي تغيّر"},
    {"level":"formal","en":"...","ar":"...","noteAr":"..."},
    {"level":"academic","en":"...","ar":"...","noteAr":"..."},
    {"level":"legal","en":"...","ar":"...","noteAr":"..."}
  ]
}

Source:
"""
${input.trim()}
"""`;
      const t = await callAI(prompt, null, 2500);
      const obj = extractJSON(t);
      if (!obj || !Array.isArray(obj.versions)) throw new Error('parse');
      setVersions(obj.versions);
    } catch (e) {
      if (e.code === 'NO_API_KEY') setErr('أدخل مفتاح API من زر الإعدادات');
      else if (e.code === 'INVALID_KEY') setErr('مفتاح API غير صالح');
      else setErr('تعذّر التوليد — حاول مجدداً');
    } finally { setLoading(false); }
  };

  const evaluate = async () => {
    if (!input.trim() || !userText.trim()) return;
    setLoadingEval(true); setErr(''); setEvaluation(null); setShowModel(false);
    try {
      const lvl = STYLE_LEVEL_MAP[targetLevel] || STYLE_LEVEL_MAP.formal;
      const prompt =
`A learner was asked to rewrite an English source text at the "${lvl.en}" level.

Source text:
"""
${input.trim()}
"""

Learner's attempt:
"""
${userText.trim()}
"""

Evaluate: (1) how well it fits the target ${lvl.en} register, (2) grammatical correctness,
(3) naturalness, (4) preservation of original meaning. Be specific.

Return ONLY JSON:
{
  "score": 0-100,
  "registerFit": 0-100,
  "grammar": 0-100,
  "naturalness": 0-100,
  "meaningPreserved": true|false,
  "overallAr": "تقييم شامل بالعربية",
  "corrections": [
    {"original":"the exact learner phrase","corrected":"better English","noteAr":"شرح بالعربية"}
  ],
  "registerMissesAr": ["كلمات/تراكيب لا تناسب المستوى المستهدف"],
  "modelVersion": "an excellent rewrite at the target register",
  "encouragementAr": "رسالة تشجيع قصيرة بالعربية"
}`;
      const t = await callAI(prompt, null, 2000);
      const obj = extractJSON(t);
      if (!obj) throw new Error('parse');
      setEvaluation(obj);
    } catch (e) {
      if (e.code === 'NO_API_KEY') setErr('أدخل مفتاح API من زر الإعدادات');
      else if (e.code === 'INVALID_KEY') setErr('مفتاح API غير صالح');
      else setErr('تعذّر التقييم');
    } finally { setLoadingEval(false); }
  };

  return (
    <div style={T.card}>
      <h2 style={T.h2}>تحويل المستوى اللغوي</h2>
      <div style={{ ...T.muted, marginTop: '4px', marginBottom: '10px' }}>
        ألصق نصاً إنجليزياً وشاهد كيف يتغيّر عبر المستويات الأربعة، أو دَرّب نفسك على إعادة كتابته بمستوى محدد.
      </div>

      <div style={{ display: 'flex', gap: '6px', flexWrap: 'wrap', marginBottom: '10px' }}>
        <button onClick={() => setSubmode('show')} style={btn(submode === 'show' ? 'amber' : 'secondary', 'sm')}>
          <Eye size={14} /> عرض المستويات
        </button>
        <button onClick={() => setSubmode('practice')} style={btn(submode === 'practice' ? 'amber' : 'secondary', 'sm')}>
          <PenLine size={14} /> تدريب
        </button>
      </div>

      <label style={T.label}>النص الإنجليزي</label>
      <textarea
        dir="ltr"
        style={{ ...T.textarea, ...T.english, minHeight: '110px' }}
        value={input}
        onChange={e => setInput(e.target.value)}
        placeholder="Paste English text to transform..."
      />

      {submode === 'show' && (
        <div style={{ marginTop: '10px', display: 'flex', gap: '8px', flexWrap: 'wrap' }}>
          <button onClick={generate} disabled={!input.trim() || loading} style={btn('primary', 'md')}>
            {loading ? <Spinner size={14} /> : <Sparkles size={14} />} ولّد المستويات الأربعة
          </button>
          <button onClick={() => setVersions(null)} disabled={!versions} style={btn('ghost', 'md')}>
            <X size={14} /> مسح
          </button>
        </div>
      )}

      {submode === 'practice' && (
        <>
          <div style={{ marginTop: '12px' }}>
            <div style={T.label}>المستوى المستهدف</div>
            <div style={{ display: 'flex', flexWrap: 'wrap', gap: '6px' }}>
              {STYLE_LEVELS.map(l => (
                <button key={l.id} onClick={() => setTargetLevel(l.id)} style={btn(targetLevel === l.id ? 'amber' : 'secondary', 'sm')}>
                  {l.ar}
                </button>
              ))}
            </div>
          </div>
          <div style={{ marginTop: '10px' }}>
            <label style={T.label}>محاولتك بإعادة الكتابة عند مستوى «{STYLE_LEVEL_MAP[targetLevel]?.ar}»</label>
            <textarea
              dir="ltr"
              style={{ ...T.textarea, ...T.english }}
              value={userText}
              onChange={e => setUserText(e.target.value)}
              placeholder={`Rewrite the source text in ${STYLE_LEVEL_MAP[targetLevel]?.en} English...`}
            />
          </div>
          <div style={{ marginTop: '10px', display: 'flex', gap: '8px', flexWrap: 'wrap' }}>
            <button onClick={evaluate} disabled={!input.trim() || !userText.trim() || loadingEval} style={btn('primary', 'md')}>
              {loadingEval ? <Spinner size={14} /> : <Send size={14} />} قيّم محاولتي
            </button>
            <button onClick={() => speak(userText)} disabled={!userText.trim()} style={btn('amber', 'md')}>
              <Volume2 size={14} /> استمع لمحاولتي
            </button>
          </div>
        </>
      )}

      {err && <div style={{ color: 'var(--color-text-danger, #B91C1C)', marginTop: '10px', fontSize: '13px' }}>{err}</div>}

      {submode === 'show' && versions && versions.length > 0 && (
        <div style={{ marginTop: '14px', display: 'flex', flexDirection: 'column', gap: '10px' }}>
          {versions.map((v, i) => {
            const lvl = STYLE_LEVEL_MAP[v.level] || { ar: v.level, en: v.level };
            return (
              <div key={i} style={T.cardInner}>
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', gap: '8px', flexWrap: 'wrap', marginBottom: '6px' }}>
                  <span style={pill('amber')}>{lvl.ar}</span>
                  <button onClick={() => speak(v.en)} style={btn('amber', 'sm')}>
                    <Volume2 size={12} /> استمع
                  </button>
                </div>
                {v.en && <div dir="ltr" style={{ ...T.english, lineHeight: 1.7, whiteSpace: 'pre-wrap' }}>{v.en}</div>}
                {v.ar && <div style={{ ...T.muted, fontSize: '13px', marginTop: '6px' }}>{v.ar}</div>}
                {v.noteAr && (
                  <div style={{ marginTop: '6px', color: AMBER.text, background: AMBER.bg, padding: '6px 8px', borderRadius: '6px', fontSize: '12px' }}>
                    💡 {v.noteAr}
                  </div>
                )}
              </div>
            );
          })}
        </div>
      )}

      {submode === 'practice' && evaluation && (
        <div style={{ marginTop: '14px', display: 'flex', flexDirection: 'column', gap: '10px' }}>
          <div style={{ ...T.cardInner, textAlign: 'center', background: AMBER.bg, borderColor: AMBER.border }}>
            <div style={{ fontSize: '34px', fontWeight: 800, color: AMBER.text }}>{evaluation.score}/100</div>
            <div style={{ color: AMBER.text, marginTop: '4px' }}>{evaluation.overallAr}</div>
          </div>

          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(140px, 1fr))', gap: '8px' }}>
            {[
              ['registerFit', 'مطابقة المستوى'],
              ['grammar', 'القواعد'],
              ['naturalness', 'الانسيابية'],
            ].map(([k, label]) => (
              <div key={k} style={{ ...T.cardInner, textAlign: 'center' }}>
                <div style={{ ...T.muted, fontSize: '12px' }}>{label}</div>
                <div style={{ fontSize: '22px', fontWeight: 700, color: AMBER.text }}>{evaluation[k] ?? '-'}</div>
              </div>
            ))}
            <div style={{ ...T.cardInner, textAlign: 'center' }}>
              <div style={{ ...T.muted, fontSize: '12px' }}>المعنى محفوظ</div>
              <div style={{ fontSize: '22px', fontWeight: 700, color: evaluation.meaningPreserved ? 'var(--color-text-success, #157A42)' : 'var(--color-text-danger, #B91C1C)' }}>
                {evaluation.meaningPreserved ? '✓' : '✗'}
              </div>
            </div>
          </div>

          {evaluation.corrections && evaluation.corrections.length > 0 && (
            <div style={T.cardInner}>
              <div style={T.label}>تصحيحات</div>
              {evaluation.corrections.map((c, i) => (
                <div key={i} style={{ marginBottom: '10px', paddingBottom: '10px', borderBottom: '1px dashed var(--color-border-primary, #e5e5e5)' }}>
                  <div dir="ltr" style={{ color: 'var(--color-text-danger, #B91C1C)', textDecoration: 'line-through', fontFamily: 'Georgia, serif' }}>{c.original}</div>
                  <div dir="ltr" style={{ color: 'var(--color-text-success, #157A42)', fontFamily: 'Georgia, serif' }}>{c.corrected}</div>
                  <div style={{ ...T.muted, marginTop: '4px' }}>{c.noteAr}</div>
                </div>
              ))}
            </div>
          )}

          {evaluation.registerMissesAr && evaluation.registerMissesAr.length > 0 && (
            <div style={{ ...T.cardInner, background: 'var(--color-background-info, #E0F2FF)', borderColor: 'var(--color-text-info, #0369A1)' }}>
              <div style={{ ...T.label, color: 'var(--color-text-info, #0369A1)' }}>عناصر لا تناسب المستوى</div>
              <ul style={{ color: 'var(--color-text-info, #0369A1)', margin: 0, paddingInlineStart: '20px' }}>
                {evaluation.registerMissesAr.map((m, i) => <li key={i} style={{ marginBottom: '4px' }}>{m}</li>)}
              </ul>
            </div>
          )}

          {evaluation.modelVersion && (
            <div style={T.cardInner}>
              <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', gap: '6px', flexWrap: 'wrap' }}>
                <div style={T.label}>نسخة نموذجية</div>
                <button onClick={() => setShowModel(s => !s)} style={btn('ghost', 'sm')}>
                  {showModel ? <EyeOff size={12} /> : <Eye size={12} />}
                  {showModel ? ' أخفِ' : ' اكشف'}
                </button>
              </div>
              {showModel && (
                <>
                  <div dir="ltr" style={{ ...T.english, fontStyle: 'italic', lineHeight: 1.7 }}>{evaluation.modelVersion}</div>
                  <button onClick={() => speak(evaluation.modelVersion)} style={{ ...btn('amber', 'sm'), marginTop: '6px' }}>
                    <Volume2 size={12} /> استمع
                  </button>
                </>
              )}
            </div>
          )}

          {evaluation.encouragementAr && (
            <div style={{ ...T.cardInner, background: 'var(--color-background-success, #E7F6EA)', borderColor: 'var(--color-text-success, #157A42)' }}>
              <div style={{ color: 'var(--color-text-success, #157A42)' }}>{evaluation.encouragementAr}</div>
            </div>
          )}
        </div>
      )}
    </div>
  );
}

function TranslationChallengeMode() {
  const [domain, setDomain] = useState('daily');
  const [difficulty, setDifficulty] = useState('medium');
  const [prompt, setPrompt] = useState(null);
  const [userText, setUserText] = useState('');
  const [evalRes, setEvalRes] = useState(null);
  const [loadingPrompt, setLoadingPrompt] = useState(false);
  const [loadingEval, setLoadingEval] = useState(false);
  const [err, setErr] = useState('');
  const [showModel, setShowModel] = useState(false);

  const difficulties = [
    { id: 'easy',   ar: 'سهل (جملة)' },
    { id: 'medium', ar: 'متوسط (2-3 جمل)' },
    { id: 'hard',   ar: 'صعب (فقرة)' },
  ];

  const newPrompt = async () => {
    setLoadingPrompt(true); setErr(''); setEvalRes(null); setUserText(''); setShowModel(false);
    try {
      const d = DOMAIN_MAP[domain] || DOMAIN_MAP.daily;
      const lengthHint = difficulty === 'easy'
        ? 'one Arabic sentence (12-18 words)'
        : difficulty === 'medium'
          ? 'a short Arabic passage of 2-3 sentences (35-55 words)'
          : 'a cohesive Arabic paragraph (75-100 words)';
      const p =
`Generate ${lengthHint} in the "${d.en}" context, suitable for a B2+ Arabic learner
to translate INTO English. The Arabic should sound natural (not translation-ese)
and include domain-specific phrasing or idiom when possible.

Return ONLY JSON (no fences, no commentary):
{
  "arabic": "النص العربي الذي يجب ترجمته للإنجليزية",
  "hintAr": "تلميح قصير بالعربية عن نقطة لغوية يجب الانتباه لها",
  "trickyTerms": [{"ar":"...","hintEn":"how to render in English"}]
}`;
      const text = await callAI(p, null, 1000);
      const obj = extractJSON(text);
      if (!obj || !obj.arabic) throw new Error('parse');
      setPrompt(obj);
    } catch (e) {
      if (e.code === 'NO_API_KEY') setErr('أدخل مفتاح API من زر الإعدادات');
      else if (e.code === 'INVALID_KEY') setErr('مفتاح API غير صالح');
      else setErr('تعذّر توليد نص — حاول مجدداً');
    } finally { setLoadingPrompt(false); }
  };

  const evaluate = async () => {
    if (!userText.trim() || !prompt) return;
    setLoadingEval(true); setErr(''); setEvalRes(null); setShowModel(false);
    try {
      const d = DOMAIN_MAP[domain] || DOMAIN_MAP.daily;
      const p =
`You are evaluating an Arabic→English translation by a B2+ learner.
Domain context: ${d.en}.

Source Arabic:
"""
${prompt.arabic}
"""

Learner's English translation:
"""
${userText.trim()}
"""

Judge: accuracy of meaning, grammatical correctness, naturalness/idiomatic flow,
and register fit for the ${d.en} domain.

Return ONLY JSON (no fences):
{
  "score": 0-100,
  "accuracy": 0-100,
  "grammar": 0-100,
  "naturalness": 0-100,
  "registerFit": 0-100,
  "overallAr": "تقييم شامل بالعربية",
  "corrections": [
    {"original":"the exact English phrase from learner","corrected":"better English","noteAr":"شرح بالعربية"}
  ],
  "missedNuancesAr": ["فروق دقيقة في المعنى ضاعت أو لم تُنقَل"],
  "modelTranslation": "an excellent B2+ English translation",
  "encouragementAr": "رسالة تشجيعية قصيرة بالعربية"
}`;
      const text = await callAI(p, null, 2000);
      const obj = extractJSON(text);
      if (!obj) throw new Error('parse');
      setEvalRes(obj);
    } catch (e) {
      if (e.code === 'NO_API_KEY') setErr('أدخل مفتاح API من زر الإعدادات');
      else if (e.code === 'INVALID_KEY') setErr('مفتاح API غير صالح');
      else setErr('تعذّر التقييم — حاول مجدداً');
    } finally { setLoadingEval(false); }
  };

  return (
    <div style={T.card}>
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', flexWrap: 'wrap', gap: '6px' }}>
        <h2 style={T.h2}>تحدّي الترجمة (عربي → إنجليزي)</h2>
        <button onClick={newPrompt} disabled={loadingPrompt} style={btn('amber', 'sm')}>
          {loadingPrompt ? <Spinner size={14} /> : <Sparkles size={14} />} نص جديد
        </button>
      </div>
      <div style={{ ...T.muted, marginTop: '4px', marginBottom: '12px' }}>
        تمرين عكسي يجبرك على إنتاج الإنجليزية بدل التعرّف عليها — أقوى أنواع تدريب الكتابة.
      </div>

      <div style={{ marginBottom: '10px' }}>
        <div style={T.label}>السياق</div>
        <div style={{ display: 'flex', flexWrap: 'wrap', gap: '6px' }}>
          {DOMAINS.map(d => {
            const I = d.icon;
            return (
              <button key={d.id} onClick={() => setDomain(d.id)} style={btn(domain === d.id ? 'amber' : 'secondary', 'sm')}>
                <I size={12} /> {d.ar}
              </button>
            );
          })}
        </div>
      </div>

      <div style={{ marginBottom: '12px' }}>
        <div style={T.label}>الصعوبة</div>
        <div style={{ display: 'flex', flexWrap: 'wrap', gap: '6px' }}>
          {difficulties.map(d => (
            <button key={d.id} onClick={() => setDifficulty(d.id)} style={btn(difficulty === d.id ? 'amber' : 'secondary', 'sm')}>
              {d.ar}

  const newTopic = async () => {
    setLoadingTopic(true); setErr(''); setEvaluation(null); setText('');
    try {
      const sample = shuffle(words).slice(0, 8).map(w => w.word);
      const prompt =
`Generate ONE writing prompt for an Arabic-speaking B2+ English learner.
Make the topic everyday-practical (work, news, life, travel, opinion).
${sample.length ? `If natural, suggest words from this list to use: ${JSON.stringify(sample)}.` : ''}

}`;

      const obj = extractJSON(t);
      if (!obj || !obj.topic) throw new Error('parse');

function BuilderMode({ words }) {
  const [picked, setPicked] = useState([]);
  const [story, setStory] = useState(null);
  const [userText, setUserText] = useState('');
  const [feedback, setFeedback] = useState(null);
  const [loading1, setLoading1] = useState(false);
  const [loading2, setLoading2] = useState(false);
  const [err, setErr] = useState('');

  const togglePick = (w) => {
    if (picked.find(p => p.id === w.id)) setPicked(picked.filter(p => p.id !== w.id));
    else if (picked.length < 3) setPicked([...picked, w]);
  };

  const buildStory = async () => {
    if (picked.length < 2) return;
    setLoading1(true); setErr(''); setStory(null); setFeedback(null);
    try {
      const list = picked.map(w => w.word);
      const prompt =
`Write a short cohesive English mini-story (4-6 sentences) at B2 level
that naturally uses ALL of these words/phrases: ${JSON.stringify(list)}.
Then provide its Arabic translation.

Return ONLY JSON:
{
  "story": "the English story",
  "ar": "ترجمة عربية"
}`;
      const t = await callAI(prompt);
      const obj = extractJSON(t);
      if (!obj || !obj.story) throw new Error('parse');
      setStory(obj);
    } catch (e) { setErr(handleAIError(e, 'تعذّر التوليد')); }
    finally { setLoading1(false); }
  };

  const evaluateMine = async () => {
    if (!userText.trim() || picked.length === 0) return;
    setLoading2(true); setErr(''); setFeedback(null);
    try {
      const list = picked.map(w => w.word);
      const prompt =
`The learner had to write an English mini-story using these words: ${JSON.stringify(list)}.
Their writing:
"""
${userText.trim()}
"""
Evaluate it. Return ONLY JSON:
{
  "usedAll": true|false,
  "missing": ["word that was not used or was misused"],
  "score": 0-100,
  "feedbackAr": "تغذية راجعة عربية",
  "improved": "improved English version"
}`;
      const t = await callAI(prompt);
      const obj = extractJSON(t);
      if (!obj) throw new Error('parse');
      setFeedback(obj);
    } catch (e) { setErr(handleAIError(e, 'تعذّر التقييم')); }
    finally { setLoading2(false); }
  };

  if (words.length === 0) {
    return <div style={{ ...T.card, color: 'var(--color-text-secondary)' }}>أضف كلمات أولاً لبناء قصة.</div>;
  }

  return (
    <div style={T.card}>
      <h2 style={T.h2}>بناء جملة / قصة</h2>
      <div style={{ ...T.muted, marginTop: '4px', marginBottom: '12px' }}>
        اختر 2-3 كلمات من مكتبتك، شاهد كيف تستخدمها في سياق، ثم اكتب نسختك.
      </div>

      <div style={T.label}>اختر كلمات ({picked.length}/3)</div>
      <div style={{ display: 'flex', flexWrap: 'wrap', gap: '6px', marginBottom: '12px', maxHeight: '180px', overflow: 'auto', padding: '4px' }}>
        {words.map(w => {
          const isP = picked.find(p => p.id === w.id);
          return (
            <button key={w.id} onClick={() => togglePick(w)}
              style={btn(isP ? 'amber' : 'secondary', 'sm')}>
              <span dir="ltr" style={T.english}>{w.word}</span>
            </button>
          );
        })}
      </div>

      <button onClick={buildStory} disabled={picked.length < 2 || loading1} style={btn('primary', 'md')}>
        {loading1 ? <Spinner size={14} /> : <Sparkles size={14} />} أنشئ قصة نموذج
      </button>

      {story && (
        <div style={{ ...T.cardInner, marginTop: '12px', background: AMBER.bg, borderColor: AMBER.border }}>
          <div dir="ltr" style={{ ...T.english, marginBottom: '6px' }}>{story.story}</div>
          <div style={{ color: AMBER.text, fontSize: '13px' }}>{story.ar}</div>
          <button onClick={() => speak(story.story)} style={{ ...btn('secondary', 'sm'), marginTop: '6px' }}>
            <Volume2 size={12} /> استمع
          </button>
        </div>
      )}

      <div style={{ marginTop: '14px' }}>
        <label style={T.label}>الآن اكتب نسختك الخاصة</label>
        <textarea dir="ltr" style={{ ...T.textarea, ...T.english }} value={userText}
          onChange={e => setUserText(e.target.value)} placeholder="Your own version using the chosen words..." />
      </div>
      <button onClick={evaluateMine} disabled={!userText.trim() || loading2} style={{ ...btn('primary', 'md'), marginTop: '8px' }}>
        {loading2 ? <Spinner size={14} /> : <Send size={14} />} قيّم نسختي
      </button>

      {err && <div style={{ color: 'var(--color-text-danger, #B91C1C)', marginTop: '8px', fontSize: '13px' }}>{err}</div>}

      {feedback && (
        <div style={{ ...T.cardInner, marginTop: '12px' }}>
          <div style={{ fontSize: '28px', fontWeight: 800, textAlign: 'center', color: AMBER.text }}>{feedback.score}/100</div>
          <div style={{ marginBottom: '10px' }}>{feedback.feedbackAr}</div>
          {feedback.missing && feedback.missing.length > 0 && (
            <div style={pill('danger')}>لم تُستخدم: {feedback.missing.join(', ')}</div>
          )}
          {feedback.improved && (
            <div style={{ marginTop: '10px' }}>
              <div style={T.label}>نسخة محسّنة</div>
              <div dir="ltr" style={{ ...T.english, fontStyle: 'italic' }}>{feedback.improved}</div>
            </div>
          )}
        </div>
      )}
    </div>
  );
}

function ParaphraseMode() {
  const [original, setOriginal] = useState(null);
  const [userText, setUserText] = useState('');
  const [evalRes, setEvalRes] = useState(null);
  const [loading1, setLoading1] = useState(false);
  const [loading2, setLoading2] = useState(false);
  const [err, setErr] = useState('');

  const newSentence = async () => {
    setLoading1(true); setErr(''); setEvalRes(null); setUserText('');
    try {
      const prompt =
`Give ONE English sentence at B2 level (15-25 words) for paraphrasing practice.
Topic can be from: news, business, law, medicine, daily life, opinion.
Return ONLY JSON:
{ "sentence": "...", "ar": "ترجمة عربية", "hintAr": "تلميح للصياغة بطريقة مختلفة" }`;
      const t = await callAI(prompt);
      const obj = extractJSON(t);
      if (!obj || !obj.sentence) throw new Error('parse');
      setOriginal(obj);
    } catch (e) { setErr(handleAIError(e, 'تعذّر توليد جملة')); }
    finally { setLoading1(false); }
  };

  const evaluate = async () => {
    if (!userText.trim() || !original) return;
    setLoading2(true); setErr('');
    try {
      const prompt =
`Original: "${original.sentence}"
Learner's paraphrase: "${userText.trim()}"

Evaluate: did the meaning survive? is the grammar correct? is wording sufficiently different?

Return ONLY JSON:
{
  "score": 0-100,
  "preservedMeaning": true|false,
  "differentEnough": true|false,
  "feedbackAr": "تغذية راجعة عربية",
  "modelParaphrase": "a clean B2 paraphrase model"
}`;
      const t = await callAI(prompt);
      const obj = extractJSON(t);
      if (!obj) throw new Error('parse');
      setEvalRes(obj);
    } catch (e) { setErr(handleAIError(e, 'تعذّر التقييم')); }
    finally { setLoading2(false); }
  };

  return (
    <div style={T.card}>
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', flexWrap: 'wrap' }}>
        <h2 style={T.h2}>إعادة صياغة</h2>
        <button onClick={newSentence} disabled={loading1} style={btn('amber', 'sm')}>
          {loading1 ? <Spinner size={14} /> : <Sparkles size={14} />} جملة جديدة
        </button>
      </div>
      <div style={{ ...T.muted, marginTop: '4px', marginBottom: '10px' }}>
        أعد كتابة الجملة بكلماتك دون فقدان المعنى — تمرين قوي للمرونة في الكتابة.
      </div>

      {original && (
        <div style={{ ...T.cardInner, background: AMBER.bg, borderColor: AMBER.border, marginBottom: '12px' }}>
          <div dir="ltr" style={{ ...T.english, fontSize: '16px' }}>{original.sentence}</div>
          <div style={{ color: AMBER.text, fontSize: '13px', marginTop: '4px' }}>{original.ar}</div>
          {original.hintAr && <div style={{ color: AMBER.text, fontSize: '12px', marginTop: '6px' }}>💡 {original.hintAr}</div>}
        </div>
      )}

      <textarea dir="ltr" style={{ ...T.textarea, ...T.english }} value={userText}
        onChange={e => setUserText(e.target.value)} placeholder="Rewrite in your own words..." />
      <button onClick={evaluate} disabled={!userText.trim() || !original || loading2} style={{ ...btn('primary', 'md'), marginTop: '8px' }}>
        {loading2 ? <Spinner size={14} /> : <Send size={14} />} قيّم
      </button>
      {err && <div style={{ color: 'var(--color-text-danger, #B91C1C)', marginTop: '8px', fontSize: '13px' }}>{err}</div>}

      {evalRes && (
        <div style={{ ...T.cardInner, marginTop: '12px' }}>
          <div style={{ fontSize: '24px', fontWeight: 800, textAlign: 'center' }}>{evalRes.score}/100</div>
          <div style={{ display: 'flex', gap: '6px', justifyContent: 'center', flexWrap: 'wrap', marginBottom: '8px' }}>
            <span style={pill(evalRes.preservedMeaning ? 'success' : 'danger')}>
              المعنى: {evalRes.preservedMeaning ? '✓' : '✗'}
            </span>
            <span style={pill(evalRes.differentEnough ? 'success' : 'danger')}>
              صياغة جديدة: {evalRes.differentEnough ? '✓' : '✗'}
            </span>
          </div>
          <div style={{ marginBottom: '8px' }}>{evalRes.feedbackAr}</div>
          {evalRes.modelParaphrase && (
            <>
              <div style={T.label}>نموذج</div>
              <div dir="ltr" style={{ ...T.english, fontStyle: 'italic' }}>{evalRes.modelParaphrase}</div>
            </>
          )}
        </div>
      )}
    </div>
  );
}
